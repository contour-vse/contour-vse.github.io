<title>Contour Challenge</title>

<style>

:root{--navy:#0C3166;--navy2:#08244d;--cream:#FFF9F1;--lime:#D7FC3D;--blue:#007AFF;--char:#212121;--red:#E5484D;--green:#1F9D55;--H:'Archivo Black','Arial Black',Arial,sans-serif;--B:Inter,'Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--navy);color:var(--cream);font-family:var(--B);-webkit-tap-highlight-color:transparent}
body{padding:env(safe-area-inset-top,0) max(16px,env(safe-area-inset-right,0)) env(safe-area-inset-bottom,0) max(16px,env(safe-area-inset-left,0))}
h1,h2,h3{font-family:var(--H);font-weight:400;margin:0;text-wrap:balance}
button{font:inherit;cursor:pointer;border:0}
.hl{background:var(--lime);color:var(--char);border-radius:10px;padding:0 .18em}
#app{min-height:100%}

.card{background:var(--cream);color:var(--char);border-radius:22px;padding:20px}
.inp{width:100%;font:700 22px var(--B);padding:14px 16px;border-radius:14px;border:2px solid #d9d1c4;background:#fff;color:var(--char)}
.big{width:100%;padding:16px;border-radius:16px;background:var(--lime);color:var(--char);font:400 24px var(--H)}
.big:disabled{opacity:.5}
.badge{border-radius:24px;padding:26px 20px;text-align:center;color:#fff}
.badge .e{font-size:84px;line-height:1}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans button{min-height:120px;border-radius:18px;color:#fff;font:800 19px var(--B);padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:transform .15s,opacity .3s}
.ans button b{font:400 34px var(--H)}
.ans button:active{transform:scale(.96)}
.ans.locked button{opacity:.35}.ans.locked button.me{opacity:1;outline:5px solid var(--lime)}
.bar{height:10px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden}.bar i{display:block;height:100%;background:var(--lime);width:100%;transition:width .25s linear}
.res{border-radius:22px;padding:26px;text-align:center}
.res .e{font-size:70px}
.muted{opacity:.75}
.qa-item{display:flex;gap:12px;align-items:center;background:#fff;color:var(--char);border-radius:14px;padding:12px 14px}
.qa-item .v{flex:none;min-width:58px;border-radius:12px;padding:8px 6px;background:#eee;font:800 16px var(--B);text-align:center}
.qa-item .v.on{background:var(--lime)}
.qa-item.done{opacity:.45}
/* ---------- host (projector) ---------- */
.hw{position:fixed;inset:0;padding:40px 56px;display:flex;flex-direction:column;gap:22px;overflow:hidden}
.top{display:flex;align-items:center;gap:18px}
.top h1{font-size:44px;flex:1}
.pill{background:rgba(255,255,255,.12);border-radius:30px;padding:8px 18px;font-weight:800;font-size:18px}
.facs{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.fac{border-radius:22px;padding:18px;color:#fff;position:relative;overflow:hidden}
.fac .e{font-size:54px;line-height:1}.fac h3{font-size:30px;margin:6px 0 2px}
.fac .n{font:400 46px var(--H)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;max-height:150px;overflow:hidden}
.chips span{background:rgba(255,255,255,.22);border-radius:12px;padding:3px 10px;font-weight:700;font-size:15px;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.qbig{font:400 50px var(--H);line-height:1.15;max-width:1500px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:18px;flex:1}
.opt{border-radius:22px;color:#fff;display:flex;align-items:center;gap:20px;padding:18px 26px;font:800 34px var(--B);position:relative;overflow:hidden;transition:opacity .4s,transform .4s}
.opt b{font:400 54px var(--H);flex:none}
.opt .cnt{position:absolute;right:22px;bottom:12px;font:400 40px var(--H)}
.opt .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.18);width:0;transition:width 1s}
.rev .opt.no{opacity:.28;transform:scale(.97)}.rev .opt.yes{outline:8px solid var(--lime);transform:scale(1.02)}
.ring{position:relative;width:170px;height:170px;flex:none}.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:400 64px var(--H)}
.fact{background:var(--lime);color:var(--char);border-radius:18px;padding:16px 22px;font:800 26px var(--B)}
.race{display:grid;gap:16px}
.lane{display:grid;grid-template-columns:260px 1fr 150px;align-items:center;gap:18px;font:400 30px var(--H)}
.lane .tr{height:62px;border-radius:16px;background:rgba(255,255,255,.1);overflow:hidden;position:relative}
.lane .tr i{position:absolute;inset:0 auto 0 0;border-radius:16px;transition:width 1.2s cubic-bezier(.2,.8,.2,1);display:flex;align-items:center;justify-content:flex-end;padding-right:14px;font-size:34px}
.tops{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tops div{background:rgba(255,255,255,.1);border-radius:14px;padding:10px 14px;font-weight:800;font-size:20px;display:flex;gap:10px;align-items:center}
.tops div b{font:400 26px var(--H);color:var(--lime)}
.offer{background:var(--cream);color:var(--navy);border-radius:16px;padding:12px 16px;font:400 26px var(--H);display:flex;gap:10px;align-items:center;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.qrbox{background:#fff;border-radius:26px;padding:18px;text-align:center;color:var(--navy)}
.qrbox img{width:300px;height:300px;display:block}
.tag{display:inline-block;background:var(--lime);color:var(--char);font:400 26px var(--H);border-radius:12px;padding:4px 14px;margin-bottom:12px;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.keys{position:fixed;right:16px;bottom:12px;font-size:13px;opacity:.45}
.hqa{display:grid;gap:12px}
.hqa div{background:var(--cream);color:var(--char);border-radius:18px;padding:16px 20px;display:flex;gap:18px;align-items:center;font:700 26px var(--B);cursor:pointer}
.hqa div b{flex:none;background:var(--lime);border-radius:12px;padding:6px 14px;font:400 30px var(--H)}
.hqa div.done{opacity:.35}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.lgw{display:inline-flex;align-items:center}.lgw img{height:22px;display:block}
.hw .top .lgw img{height:30px}
.brand{gap:12px}.brand>span:not(.lgw){font:400 20px var(--H)}
.tile{background:rgba(255,255,255,.1);border-radius:18px;padding:16px;font-weight:800;font-size:22px;display:flex;gap:12px;align-items:center}
.qsm{font:400 30px var(--H);line-height:1.2}
.opt.sm{font-size:26px;padding:12px 22px;flex:1}.opt.sm b{font-size:40px}
.chart{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end;height:120px}
.chart.big{height:auto;min-height:0;gap:18px;background:rgba(255,255,255,.06);border-radius:22px;padding:18px 18px 14px}
.chart .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.chart .bar{width:78%;border-radius:10px 10px 4px 4px;min-height:4px;transition:height 1s cubic-bezier(.2,.8,.2,1);animation:grow 1s cubic-bezier(.2,.8,.2,1)}
@keyframes grow{from{height:0!important}}
.chart.big .col{min-height:300px}
.chart .cnt{font:400 22px var(--H);color:var(--char);text-align:center;line-height:1}.chart .cnt small{display:block;font:800 12px var(--B);opacity:.7}
.chart.big .cnt{font-size:40px;color:var(--cream)}.chart.big .cnt small{font-size:18px}
.chart .lab{width:100%;border-radius:10px;color:#fff;font:400 18px var(--H);text-align:center;padding:4px 0}
.chart.big .lab{font-size:28px}
.chart .no{opacity:.45}.chart .yes .lab{outline:4px solid var(--lime)}
.toast{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);background:var(--lime);color:var(--char);font-weight:800;padding:12px 22px;border-radius:14px;z-index:9}
.nxb{position:fixed;right:16px;bottom:34px;background:rgba(255,255,255,.12);color:var(--cream);border-radius:14px;padding:10px 18px;font:800 16px var(--B)}
.keys{white-space:pre}
.hw{padding-bottom:84px}
</style>
</head>

function tone(m,t,d,type,v){var o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=mtof(m);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05)}
function kick(t,v){var o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);g.gain.setValueAtTime(v||.8,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(g);g.connect(master);o.start(t);o.stop(t+.25)}
function hat(t,v,d){var s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;f.type="highpass";f.frequency.value=7000;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+(d||.05));s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+.1)}
function clap(t,v){var s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;f.type="bandpass";f.frequency.value=1500;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+.2)}
/* Lobby: bright 112 bpm groove, C G Am F with sparkly arps. Question: 136 bpm A minor drive. */
var TRACKS={
 lobby:{bpm:112,fn:function(s,t,b){var ch=[[60,64,67],[55,59,62],[57,60,64],[53,57,60]][Math.floor(s/16)%4],i=s%16;
  if(i%4===0)kick(t,.7);if(i%8===4)clap(t,.25);if(i%2===1)hat(t,.06);
  tone(ch[[0,1,2,1][i%4]]+12+(i>=8?12:0),t,b*.9,"triangle",.07);
  if(i===0||i===10)tone(ch[0]-24,t,b*3,"triangle",.16);if(i===6||i===14)tone(ch[0]-12,t,b*1.5,"triangle",.1);
  if(i===0)[0,1,2].forEach(function(k){tone(ch[k],t,b*7,"sine",.04)})}},
 q:{bpm:136,fn:function(s,t,b){var i=s%16,bar=Math.floor(s/16)%4,root=[57,57,53,55][bar];
  if(i%4===0)kick(t,.75);if(i%8===4)clap(t,.22);hat(t,i%2?.03:.06,.03);
  var bl=[0,0,12,0,7,0,10,12];tone(root-24+bl[i%8],t,b*.8,"square",.045);
  if(i===0||i===6||i===12)[0,3,7].forEach(function(k){tone(root+k,t,b*1.2,"sawtooth",.018)});
  if(i%4===2)tone(root+24+[0,3,7,10][bar],t,b*.5,"triangle",.035)}},
 board:{bpm:120,fn:function(s,t,b){var ch=[[60,64,67],[57,60,64],[53,57,60],[55,59,62]][Math.floor(s/16)%4],i=s%16;
  if(i%4===0)kick(t,.65);if(i%8===4)clap(t,.22);if(i%2===1)hat(t,.05);if(i%4===0)tone(ch[0]-12,t,b*2,"triangle",.12);
  if(i%3===0)tone(ch[(i/3)%3]+12,t,b*1.4,"triangle",.06)}}};
function play(name){TR=name?TRACKS[name]:null;step=0;if(AC)nextT=AC.currentTime+.06}
function pump(){if(!AC||!TR)return;var b=60/TR.bpm/4;while(nextT<AC.currentTime+.12){TR.fn(step,nextT,b);step++;nextT+=b}}
function sting(){if(!AC)return;var t=AC.currentTime+.03;[60,64,67,72,76].forEach(function(m,k){tone(m,t+k*.07,.5,"triangle",.11)});[48,60,64,67].forEach(function(m){tone(m,t+.35,1.2,"sawtooth",.025)});kick(t+.35,.8)}
function fanfare(){if(!AC)return;var t=AC.currentTime+.05,sq=[[67,0],[67,.15],[67,.3],[72,.5],[71,.95],[72,1.1],[76,1.3],[79,1.6]];sq.forEach(function(x){tone(x[0],t+x[1],.45,"square",.06);tone(x[0]-12,t+x[1],.45,"triangle",.08)});[48,55,60,64,67].forEach(function(m){tone(m,t+1.6,2.4,"sawtooth",.025)});kick(t+1.6,.9);clap(t+1.6,.3)}
function tick(sec){if(!AC)return;tone(sec<=3?93:88,AC.currentTime+.01,.12,"sine",.12)}
function music(){if(!HOST||!C||!AC)return;var ph=C.phase;if(ph===curPh)return;var prev=curPh;curPh=ph;hTick.s=0;
 if(ph==="lobby")play("lobby");else if(ph==="q")play("q");else if(ph==="reveal"){play(null);sting()}else if(ph==="board")play("board");else if(ph==="final"){play(null);fanfare()}}

/* =================== PLAYER =================== */
var joined=!!ls("cc-joined-"+ROOM),picked={},sorted=!!ls("cc-sorted-"+ROOM),lastKey="",armedAt=0;
function me(){return PUB&&PUB.p?PUB.p.filter(function(p){return p.id===PID})[0]:null}
function rankOf(){if(!PUB||!PUB.p)return 0;for(var i=0;i<PUB.p.length;i++)if(PUB.p[i].id===PID)return i+1;return 0}
function myF(){var m=me();if(m)return m.f;var f=ls("cc-f-"+ROOM);return f==null?0:+f}
function pRender(){
 if(!C){app.innerHTML='<div class="pw"><div class="brand">'+LOGO+'<span>Challenge</span></div><div class="card"><h2 style="color:var(--navy)">Hang tight</h2><p>The challenge opens in a moment</p></div></div>';return}
 if(!joined){if(document.getElementById("nm"))return;
  app.innerHTML='<div class="pw"><div class="brand">'+LOGO+'<span>Challenge</span></div><h1 style="font-size:44px">Ready to <span class="hl">compete?</span></h1><div class="card" style="display:grid;gap:14px"><label for="nm" style="font-weight:800;color:var(--navy)">Your first name</label><input id="nm" class="inp" maxlength="22" autocomplete="off" value="'+esc(NAME)+'"><button class="big" id="go">Join</button><div style="font-size:14px;color:#555;font-weight:600">Sharing a phone? Put both names in</div></div></div>';
  var go=document.getElementById("go"),nm=document.getElementById("nm");
  go.onclick=function(){var n=nm.value.trim();if(!n)return nm.focus();go.disabled=true;
   var c=PUB&&PUB.f?PUB.f.map(function(x){return x.n}):[0,0,0,0],mn=Math.min.apply(null,c),op=[];c.forEach(function(x,i){if(x===mn)op.push(i)});var fi=op[Math.floor(Math.random()*op.length)];
   NAME=n;ls("cc-name",n);joined=true;ls("cc-joined-"+ROOM,"1");ls("cc-f-"+ROOM,String(fi));RR.child("pl/"+PID).set({n:n,f:fi,ts:SV});
   if(!sorted)sortAnim(fi);else{lastKey="";pRender()}};return}
 if(document.getElementById("sortanim"))return;
 var fi=myF(),f=F[fi],ph=C.phase,qi=C.qi,m=me();
 var key=ph+"|"+qi+"|"+(ph!=="q"&&PUB?PUB.seq:"");if(key===lastKey)return;
 var head='<div class="brand" style="justify-content:space-between">'+LOGO+'<span style="background:'+f[2]+';border-radius:14px;padding:4px 12px;color:#fff">'+f[1]+' '+f[0]+'</span></div>';
 if(ph==="lobby"){lastKey=key;app.innerHTML='<div class="pw">'+head+'<div class="badge" style="background:'+f[2]+'"><div class="e">'+f[1]+'</div><h1 style="font-size:46px;margin-top:8px">'+f[0]+'</h1></div><div class="card" style="text-align:center"><h2 style="color:var(--navy);font-size:26px">'+esc(NAME)+', you’re in</h2><p style="margin:6px 0 0">Eyes on the big screen</p></div></div>';return}
 if(ph==="q"){if(document.getElementById("qv")&&document.getElementById("qv").dataset.qi==qi)return;lastKey=key;var q=Q[qi],a=picked[qi];armedAt=Date.now()+450;
  app.innerHTML='<div class="pw" id="qv" data-qi="'+qi+'">'+head+'<div class="tag" style="font-size:18px;align-self:flex-start">'+q.t+'</div><div style="font-weight:800" class="muted">Round '+(qi+1)+' of '+Q.length+'</div><h2 style="font-size:26px;line-height:1.25">'+esc(q.q)+'</h2><div class="bar"><i id="tb"></i></div><div class="ans'+(a!=null?' locked':'')+'" id="ans">'+q.o.map(function(o,k){return '<button data-k="'+k+'" class="'+(a===k?'me':'')+'" style="background:'+OC[k]+'"><b>'+L[k]+'</b>'+esc(o)+'</button>'}).join("")+'</div><div id="lk" style="text-align:center;font:400 26px var(--H);color:var(--lime)">'+(a!=null?'Locked in':'')+'</div></div>';
  [].forEach.call(document.querySelectorAll("#ans button"),function(b){b.onclick=function(){if(Date.now()<armedAt||picked[qi]!=null||!C||C.phase!=="q"||C.qi!==qi)return;var t=QT(qi);if(t&&now()>t.e+1000)return;var k=+b.dataset.k;picked[qi]=k;b.classList.add("me");document.getElementById("ans").classList.add("locked");document.getElementById("lk").textContent="Locked in";if(navigator.vibrate)navigator.vibrate(30);RR.child("ans/q"+qi+"/"+PID).set({c:k,t:SV})}});return}
 if(!PUB||PUB.v!==C.v)return;lastKey=key;
 var rk=rankOf(),score=m?m.s:0,n=PUB.n,box='<div class="card" style="display:flex;justify-content:space-around;text-align:center"><div><div class="muted" style="font-weight:800">Your score</div><div style="font:400 40px var(--H);color:var(--navy)">'+score+'</div></div><div><div class="muted" style="font-weight:800">Your rank</div><div style="font:400 40px var(--H);color:var(--navy)">#'+rk+' of '+n+'</div></div></div>';
 if(ph==="reveal"){var l=PUB.last&&PUB.last[PID],my=picked[qi],kk=KEY[qi],ok=l?l[1]:(my===kk),ans=l||my!=null;
  app.innerHTML='<div class="pw">'+head+'<div class="res" style="background:'+(ans?(ok?'var(--green)':'var(--red)'):'rgba(255,255,255,.12)')+'"><div class="e">'+(ans?(ok?'🎉':'😬'):'⏰')+'</div><h1 style="font-size:44px">'+(ans?(ok?'+'+(l?l[2]:''):'Not this time'):'Too slow')+'</h1><div style="font-weight:800;margin-top:8px">Answer: '+L[kk]+' '+esc(Q[qi].o[kk])+'</div></div><div class="card" style="padding:14px 16px">'+chart(PUB.dist||[0,0,0,0],kk,false)+'</div>'+box+'</div>';return}
 var fr=PUB.f.map(function(x,i){return{i:i,s:x.s}}).sort(function(a,b){return b.s-a.s}),pos=fr.map(function(x){return x.i}).indexOf(fi)+1;
 app.innerHTML='<div class="pw">'+head+(ph==="final"&&rk>0&&rk<=3&&m&&m.s>0?'<div class="res" style="background:var(--lime);color:var(--char)"><div class="e">'+["🥇","🥈","🥉"][rk-1]+'</div><h1 style="font-size:40px">Hall of Fame</h1></div>':'')+'<div class="badge" style="background:'+f[2]+'"><div class="e">'+f[1]+'</div><h1 style="font-size:38px;margin-top:6px">'+f[0]+' are #'+pos+'</h1></div>'+box+'</div>'}
function sortAnim(fi){sorted=true;ls("cc-sorted-"+ROOM,"1");
 app.innerHTML='<div class="pw" id="sortanim" style="justify-content:center;text-align:center"><div class="muted" style="font-weight:800;font-size:20px">Sorting you into a faction</div><div id="se" style="font-size:130px;transition:transform .2s">☄️</div><h1 id="sn" style="font-size:52px">…</h1></div>';
 var se=document.getElementById("se"),sn=document.getElementById("sn"),k=0,n=0,spins=14+fi;
 (function spin(){var f=F[k%4];se.textContent=f[1];document.body.style.background=f[2];k++;n++;if(n<spins){setTimeout(spin,80+n*14)}else{var g=F[fi];se.textContent=g[1];sn.textContent=g[0]+"!";se.style.transform="scale(1.25)";if(navigator.vibrate)navigator.vibrate([60,40,120]);setTimeout(function(){document.body.style.background="";var x=document.getElementById("sortanim");if(x)x.remove();lastKey="";pRender()},1600)}})()}
function tick2(){if(!C||C.phase!=="q")return;var tb=document.getElementById("tb"),t=QT(C.qi);if(tb&&t){tb.style.width=(Math.max(0,Math.min(1,(t.e-now())/(t.e-t.s)))*100)+"%"}}
function playerStart(){
 if(joined)RR.child("pl/"+PID).once("value",function(v){if(!v.val()){joined=false;sorted=false;ls("cc-joined-"+ROOM,"");ls("cc-sorted-"+ROOM,"");lastKey="";pRender()}});
 RR.child("ctl").on("value",function(v){C=v.val()||{phase:"lobby",qi:-1,v:0,qt:{}};if(!C.qt)C.qt={};pRender()});
 RR.child("pub").on("value",function(v){PUB=v.val();if(PUB){PUB.p=PUB.p||[];PUB.f=PUB.f||[{n:0,s:0},{n:0,s:0},{n:0,s:0},{n:0,s:0}]}pRender()});
  setInterval(tick2,100)}
function render(){if(HOST)hRender();else pRender()}
if(HOST)hostStart();else playerStart();
