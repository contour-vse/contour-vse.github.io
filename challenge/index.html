<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Contour Challenge</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700;800&display=swap">
<style>

:root{--navy:#0C3166;--navy2:#08244d;--cream:#FFF9F1;--lime:#D7FC3D;--blue:#007AFF;--char:#212121;--red:#E5484D;--green:#1F9D55;--H:'Archivo Black','Arial Black',Arial,sans-serif;--B:Inter,'Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--navy);color:var(--cream);font-family:var(--B);-webkit-tap-highlight-color:transparent}
body{padding:env(safe-area-inset-top,0) max(16px,env(safe-area-inset-right,0)) env(safe-area-inset-bottom,0) max(16px,env(safe-area-inset-left,0))}
h1,h2,h3{font-family:var(--H);font-weight:400;margin:0;text-wrap:balance}
button{font:inherit;cursor:pointer;border:0}
.hl{background:var(--lime);color:var(--char);border-radius:10px;padding:0 .18em}
#app{min-height:100%}
/* ---------- player ---------- */
.pw{max-width:560px;margin:0 auto;padding:22px 0 40px;display:flex;flex-direction:column;gap:16px;min-height:100vh}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.02em}
.brand i{width:30px;height:30px;border-radius:50%;background:var(--lime);display:inline-flex;align-items:center;justify-content:center;color:var(--navy);font:400 18px var(--H);font-style:normal}
.card{background:var(--cream);color:var(--char);border-radius:22px;padding:20px}
.inp{width:100%;font:700 22px var(--B);padding:14px 16px;border-radius:14px;border:2px solid #d9d1c4;background:#fff;color:var(--char)}
.big{width:100%;padding:16px;border-radius:16px;background:var(--lime);color:var(--char);font:400 24px var(--H)}
.big:disabled{opacity:.5}
.badge{border-radius:24px;padding:26px 20px;text-align:center;color:#fff}
.badge .e{font-size:84px;line-height:1}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans button{min-height:120px;border-radius:18px;color:#fff;font:800 19px var(--B);padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:transform .15s,opacity .3s}
.ans button b{font:400 34px var(--H)}
.ans button:active{transform:scale(.96)}
.ans.locked button{opacity:.35}.ans.locked button.me{opacity:1;outline:5px solid var(--lime)}
.bar{height:10px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden}.bar i{display:block;height:100%;background:var(--lime);width:100%;transition:width .25s linear}
.res{border-radius:22px;padding:26px;text-align:center}
.res .e{font-size:70px}
.muted{opacity:.75}
.qa-item{display:flex;gap:12px;align-items:center;background:#fff;color:var(--char);border-radius:14px;padding:12px 14px}
.qa-item .v{flex:none;min-width:58px;border-radius:12px;padding:8px 6px;background:#eee;font:800 16px var(--B);text-align:center}
.qa-item .v.on{background:var(--lime)}
.qa-item.done{opacity:.45}
/* ---------- host (projector) ---------- */
.hw{position:fixed;inset:0;padding:40px 56px;display:flex;flex-direction:column;gap:22px;overflow:hidden}
.top{display:flex;align-items:center;gap:18px}
.top h1{font-size:44px;flex:1}
.pill{background:rgba(255,255,255,.12);border-radius:30px;padding:8px 18px;font-weight:800;font-size:18px}
.facs{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.fac{border-radius:22px;padding:18px;color:#fff;position:relative;overflow:hidden}
.fac .e{font-size:54px;line-height:1}.fac h3{font-size:30px;margin:6px 0 2px}
.fac .n{font:400 46px var(--H)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;max-height:150px;overflow:hidden}
.chips span{background:rgba(255,255,255,.22);border-radius:12px;padding:3px 10px;font-weight:700;font-size:15px;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.qbig{font:400 50px var(--H);line-height:1.15;max-width:1500px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:18px;flex:1}
.opt{border-radius:22px;color:#fff;display:flex;align-items:center;gap:20px;padding:18px 26px;font:800 34px var(--B);position:relative;overflow:hidden;transition:opacity .4s,transform .4s}
.opt b{font:400 54px var(--H);flex:none}
.opt .cnt{position:absolute;right:22px;bottom:12px;font:400 40px var(--H)}
.opt .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.18);width:0;transition:width 1s}
.rev .opt.no{opacity:.28;transform:scale(.97)}.rev .opt.yes{outline:8px solid var(--lime);transform:scale(1.02)}
.ring{position:relative;width:170px;height:170px;flex:none}.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:400 64px var(--H)}
.fact{background:var(--lime);color:var(--char);border-radius:18px;padding:16px 22px;font:800 26px var(--B)}
.race{display:grid;gap:16px}
.lane{display:grid;grid-template-columns:260px 1fr 150px;align-items:center;gap:18px;font:400 30px var(--H)}
.lane .tr{height:62px;border-radius:16px;background:rgba(255,255,255,.1);overflow:hidden;position:relative}
.lane .tr i{position:absolute;inset:0 auto 0 0;border-radius:16px;transition:width 1.2s cubic-bezier(.2,.8,.2,1);display:flex;align-items:center;justify-content:flex-end;padding-right:14px;font-size:34px}
.tops{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tops div{background:rgba(255,255,255,.1);border-radius:14px;padding:10px 14px;font-weight:800;font-size:20px;display:flex;gap:10px;align-items:center}
.tops div b{font:400 26px var(--H);color:var(--lime)}
.offer{background:var(--cream);color:var(--navy);border-radius:16px;padding:12px 16px;font:400 26px var(--H);display:flex;gap:10px;align-items:center;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.qrbox{background:#fff;border-radius:26px;padding:18px;text-align:center;color:var(--navy)}
.qrbox img{width:300px;height:300px;display:block}
.keys{position:fixed;right:16px;bottom:12px;font-size:13px;opacity:.45}
.hqa{display:grid;gap:12px}
.hqa div{background:var(--cream);color:var(--char);border-radius:18px;padding:16px 20px;display:flex;gap:18px;align-items:center;font:700 26px var(--B);cursor:pointer}
.hqa div b{flex:none;background:var(--lime);border-radius:12px;padding:6px 14px;font:400 30px var(--H)}
.hqa div.done{opacity:.35}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

var OC=["#007AFF","#E5484D","#E0A100","#1F9D55"],L=["A","B","C","D"];
var Q=[
 {q:"Ron Clarke from Melbourne High lit the Olympic cauldron at which Olympic Games?",o:["Sydney 2000","Melbourne 1956","London 1948","Rome 1960"],f:"He also went on to break 17 world records in running"},
 {q:"Sir John Eccles went to Melbourne High. What did he go on to win?",o:["A Brownlow Medal","The Archibald Prize","A Nobel Prize","The Stawell Gift"],f:"The Nobel Prize in Medicine, for how nerve cells talk to each other"},

var P=new URLSearchParams(location.search),HOST=P.has("host"),ROOM=(P.get("room")||DEF_ROOM).toUpperCase().replace(/[^A-Z0-9]/g,"");
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function uid(){var a="abcdefghjkmnpqrstuvwxyz23456789",s="";for(var i=0;i<12;i++)s+=a.charAt(Math.floor(Math.random()*a.length));return s}

  app.innerHTML='<div class="pw">'+head+'<div class="res" style="background:'+(ok?'var(--green)':(l?'var(--red)':'rgba(255,255,255,.12)'))+'"><div class="e">'+(ok?'🎉':(l?'😬':'⏰'))+'</div><h1 style="font-size:44px">'+(ok?'+'+l[2]:(l?'Not this time':'Too slow'))+'</h1><div style="font-weight:800;margin-top:8px">Answer: '+L[S.key]+' '+esc(q2.o[S.key])+'</div></div><div class="card" style="display:flex;justify-content:space-around;text-align:center"><div><div class="muted" style="font-weight:800">Your score</div><div style="font:400 40px var(--H);color:var(--navy)">'+m.s+'</div></div><div><div class="muted" style="font-weight:800">Your rank</div><div style="font:400 40px var(--H);color:var(--navy)">#'+rankOf(PID)+'</div></div></div></div>';return}
 if(S.phase==="board"||S.phase==="final"){var fr=facRank(),pos=fr.map(function(x){return x.i}).indexOf(m.f)+1,rk=rankOf(PID),n=S.players.length,cut=Math.max(1,Math.ceil(n/6)),offer=S.phase==="final"&&rk<=cut;
  app.innerHTML='<div class="pw">'+head+(offer?'<div class="res" style="background:var(--lime);color:var(--char)"><div class="e">📜</div><h1 style="font-size:40px">Round 1 Offer</h1><div style="font-weight:800">Top 1 in 6 of the room</div></div>':'')+'<div class="badge" style="background:'+f[2]+'"><div class="e">'+f[1]+'</div><h1 style="font-size:38px;margin-top:6px">'+f[0]+' are #'+pos+'</h1></div><div class="card" style="display:flex;justify-content:space-around;text-align:center"><div><div class="muted" style="font-weight:800">Your score</div><div style="font:400 40px var(--H);color:var(--navy)">'+m.s+'</div></div><div><div class="muted" style="font-weight:800">Your rank</div><div style="font:400 40px var(--H);color:var(--navy)">#'+rk+' of '+n+'</div></div></div></div>';return}
 if(S.phase==="qa"){var ta=document.getElementById("ask");if(ta)draft=ta.value;
  var list=S.qa.slice().sort(function(a,b){return(a.d-b.d)||(b.v-a.v)||(a.id-b.id)});
  app.innerHTML='<div class="pw">'+head+'<h1 style="font-size:38px">Ask the <span class="hl">panel</span></h1><div class="card" style="display:grid;gap:10px"><textarea id="ask" class="inp" rows="3" maxlength="160" style="resize:none;font-size:18px">'+esc(draft)+'</textarea><button class="big" id="send">Send question</button></div><div style="display:grid;gap:10px">'+list.map(function(x){var on=x.vs.indexOf(PID)>=0;return '<div class="qa-item'+(x.d?' done':'')+'"><button class="v'+(on?' on':'')+'" data-q="'+x.id+'">▲ '+x.v+'</button><div style="flex:1"><div style="font-weight:700">'+esc(x.t)+'</div><div style="font-size:13px;color:#666">'+esc(x.n)+'</div></div></div>'}).join("")+'</div></div>';
  var t=document.getElementById("ask");t.oninput=function(){draft=t.value};
  document.getElementById("send").onclick=function(){var v=t.value.trim();if(!v)return;draft="";t.value="";call("ask",{pid:PID,name:NAME,text:v}).then(function(){lastKey="";poll()})};
  [].forEach.call(document.querySelectorAll("[data-q]"),function(b){b.onclick=function(){b.classList.toggle("on");call("vote",{pid:PID,qid:+b.dataset.q}).then(function(){lastKey="";poll()})}});
  return}
}
function sortAnim(fi){sorted=true;ls("cc-sorted-"+ROOM,"1");
 app.innerHTML='<div class="pw" id="sortanim" style="justify-content:center;text-align:center"><div class="muted" style="font-weight:800;font-size:20px">Sorting you into a faction</div><div id="se" style="font-size:130px;transition:transform .2s">☄️</div><h1 id="sn" style="font-size:52px">…</h1></div>';
 var se=document.getElementById("se"),sn=document.getElementById("sn"),k=0,n=0,spins=14+fi;
 (function spin(){var f=F[k%4];se.textContent=f[1];document.body.style.background=f[2];k++;n++;if(n<spins){setTimeout(spin,90+n*18)}else{var g=F[fi];se.textContent=g[1];sn.textContent=g[0]+"!";se.style.transform="scale(1.25)";if(navigator.vibrate)navigator.vibrate([60,40,120]);setTimeout(function(){document.body.style.background="";var x=document.getElementById("sortanim");if(x)x.remove();lastKey="";render()},2200)}})()}
function tick(){if(!S||S.phase!=="q")return;var tb=document.getElementById("tb");if(tb){var p=Math.max(0,Math.min(1,(S.qEnd-now())/(S.qEnd-S.qStart)));tb.style.width=(p*100)+"%"}}

/* =================== HOST =================== */
var hLast="";
function hNext(){if(!S)return;var ph=S.phase,qi=S.qi;
 if(ph==="lobby")return go("q",0);
 if(ph==="q")return go("reveal",qi);
 if(ph==="reveal")return go(qi>=Q.length-1?"final":"board",qi);
 if(ph==="board")return go("q",qi+1);
 if(ph==="final"||ph==="qa")return;}
function go(ph,qi){var b={hk:HK,phase:ph,ms:20000};if(qi!=null)b.qi=qi;return call("go",b).then(poll)}
function ensureRoom(){if(HK)return call("create",{set:SET,code:ROOM,hk:HK}).then(function(r){if(!r.ok&&r.error==="taken"){HK="";return ensureRoom()}return poll()});
 return call("create",{set:SET,code:ROOM}).then(function(r){if(r.ok){HK=r.hk;ls("cc-hk-"+ROOM,HK)}else alert0("Room "+ROOM+" is already running on another computer. Open this page with ?host&room=NEWCODE");return poll()})}
function alert0(t){app.innerHTML='<div class="hw"><h1>'+esc(t)+'</h1></div>'}
function ring(left,tot){var r=74,C=2*Math.PI*r;return '<div class="ring"><svg width="170" height="170"><circle cx="85" cy="85" r="'+r+'" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="14"/><circle id="rp" cx="85" cy="85" r="'+r+'" fill="none" stroke="var(--lime)" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-left/tot))+'"/></svg><div class="v" id="rv">'+Math.ceil(left/1000)+'</div></div>'}
function hRender(){
 if(!S){app.innerHTML='<div class="hw"><h1>Opening the room…</h1></div>';return}
 var ph=S.phase,n=S.players.length;
 var key=ph+"|"+S.qi+"|"+n+"|"+S.answered+"|"+JSON.stringify(S.factions)+(ph==="qa"?JSON.stringify(S.qa):"");
 if(key===hLast)return;var first=hLast.split("|").slice(0,2).join("|")!==ph+"|"+S.qi;hLast=key;
 var facs=function(chips){return '<div class="facs">'+F.map(function(f,i){var fs=S.factions[i];var names=S.players.filter(function(p){return p.f===i}).slice(-14).map(function(p){return '<span>'+esc(p.n)+'</span>'}).join("");return '<div class="fac" style="background:'+f[2]+'"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div class="e">'+f[1]+'</div><div class="n">'+(chips?fs.n:fs.s)+'</div></div><h3>'+f[0]+'</h3>'+(chips?'<div class="chips">'+names+'</div>':'')+'</div>'}).join("")+'</div>'};
 if(ph==="lobby"){app.innerHTML='<div class="hw"><div class="top"><h1>The <span class="hl">Challenge Round</span></h1><span class="pill">'+n+' players</span></div><div style="display:grid;grid-template-columns:auto 1fr;gap:36px;align-items:start"><div class="qrbox"><img src="'+QR+'" alt=""><div style="font:400 26px var(--H);margin-top:8px">contour-vse.github.io/challenge</div><div style="font-weight:800;font-size:20px">Room '+ROOM+'</div></div><div style="display:grid;gap:18px">'+facs(true)+'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px">'+[["📱","Scan and join"],["⚡","8 questions, 20 seconds each"],["📜","Top 1 in 6 get a Round 1 Offer"]].map(function(x){return '<div style="background:rgba(255,255,255,.1);border-radius:18px;padding:16px;font-weight:800;font-size:22px;display:flex;gap:12px;align-items:center"><span style="font-size:36px">'+x[0]+'</span>'+x[1]+'</div>'}).join("")+'</div></div></div></div>';return}
 if(ph==="q"||ph==="reveal"){var q=Q[S.qi],rev=ph==="reveal",d=S.dist||[0,0,0,0],mx=Math.max(1,Math.max.apply(null,d));
  if(!first&&ph==="q"){var ac=document.getElementById("ac");if(ac){ac.textContent=S.answered+" of "+n+" answered";return}}
  app.innerHTML='<div class="hw'+(rev?' rev':'')+'"><div class="top"><span class="pill">Question '+(S.qi+1)+' of '+Q.length+'</span><span style="flex:1"></span><span class="pill" id="ac">'+S.answered+' of '+n+' answered</span></div><div style="display:flex;gap:30px;align-items:center"><div class="qbig" style="flex:1">'+esc(q.q)+'</div>'+(rev?'':'<div id="rg">'+ring(Math.max(0,S.qEnd-now()),S.qEnd-S.qStart)+'</div>')+'</div><div class="opts">'+q.o.map(function(o,k){return '<div class="opt '+(rev?(k===S.key?'yes':'no'):'')+'" style="background:'+OC[k]+'"><div class="fill" style="width:'+(rev?d[k]/mx*100:0)+'%"></div><b>'+L[k]+'</b><span style="position:relative">'+esc(o)+'</span>'+(rev?'<span class="cnt">'+d[k]+'</span>':'')+'</div>'}).join("")+'</div>'+(rev?'<div class="fact">💡 '+esc(q.f)+'</div>':'')+'</div>';return}
 if(ph==="board"||ph==="final"){var fr=facRank(),mx2=Math.max(1,fr[0].s),ps=S.players.slice().sort(function(a,b){return b.s-a.s}),cut=Math.max(1,Math.ceil(n/6));
  var race='<div class="race">'+fr.map(function(x,j){var f=F[x.i];return '<div class="lane"><span>'+(j===0?'👑 ':'')+f[0]+'</span><div class="tr"><i style="width:'+(x.s/mx2*100)+'%;background:'+f[2]+'">'+f[1]+'</i></div><span style="text-align:right">'+x.s+'</span></div>'}).join("")+'</div>';
  if(ph==="board"){app.innerHTML='<div class="hw"><div class="top"><h1>Faction <span class="hl">race</span></h1><span class="pill">After question '+(S.qi+1)+' of '+Q.length+'</span></div>'+race+'<h2 style="font-size:30px;margin-top:6px">Top players</h2><div class="tops">'+ps.slice(0,8).map(function(p,i){return '<div><b>'+(i+1)+'</b><span style="flex:1">'+esc(p.n)+'</span><span>'+F[p.f][1]+'</span><span>'+p.s+'</span></div>'}).join("")+'</div></div>';return}
  app.innerHTML='<div class="hw"><div class="top"><h1>'+F[fr[0].i][1]+' '+F[fr[0].i][0]+' <span class="hl">win</span></h1><span class="pill">'+n+' players</span></div>'+race+'<h2 style="font-size:34px;margin-top:4px">📜 Round 1 Offers: the top 1 in 6</h2><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">'+ps.slice(0,cut).map(function(p,i){return '<div class="offer" style="animation-delay:'+(i*.12)+'s"><span>'+F[p.f][1]+'</span><span style="flex:1">'+esc(p.n)+'</span><span style="font-size:20px">'+p.s+'</span></div>'}).join("")+'</div></div>';return}
 if(ph==="qa"){var list=S.qa.slice().sort(function(a,b){return(a.d-b.d)||(b.v-a.v)||(a.id-b.id)});
  app.innerHTML='<div class="hw"><div class="top"><h1>Ask the <span class="hl">panel</span></h1><span class="pill">'+S.qa.length+' questions</span></div><div style="display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:start"><div class="qrbox"><img src="'+QR+'" alt="" style="width:240px;height:240px"><div style="font-weight:800;font-size:18px;margin-top:6px">Same link, same name</div></div><div class="hqa">'+list.slice(0,7).map(function(x){return '<div data-q="'+x.id+'" class="'+(x.d?'done':'')+'"><b>▲ '+x.v+'</b><span style="flex:1">'+esc(x.t)+'</span><span style="font-size:18px;opacity:.6">'+esc(x.n)+'</span></div>'}).join("")+'</div></div></div>';
  [].forEach.call(document.querySelectorAll(".hqa [data-q]"),function(el){el.onclick=function(){call("qamod",{hk:HK,qid:+el.dataset.q,done:!el.classList.contains("done")}).then(function(){hLast="";poll()})}});return}
}
function hTick(){if(!S||S.phase!=="q")return;var left=Math.max(0,S.qEnd-now()),tot=S.qEnd-S.qStart,rp=document.getElementById("rp"),rv=document.getElementById("rv");
 if(rp){var C=2*Math.PI*74;rp.setAttribute("stroke-dashoffset",C*(1-left/tot));rv.textContent=Math.ceil(left/1000)}
 if(left<=0&&!hTick.busy){hTick.busy=true;go("reveal",S.qi).then(function(){hTick.busy=false})}}
function render(){if(HOST)hRender();else pRender()}
if(HOST){document.addEventListener("keydown",function(e){if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")return;var k=e.key;
 if(k==="ArrowRight"||k===" "||k==="PageDown"||k==="Enter"){e.preventDefault();hNext()}
 else if(k==="q"||k==="Q")go(S&&S.phase==="qa"?"final":"qa",S?S.qi:-1);
 else if(k==="l"||k==="L")go("lobby");
 else if(k==="f"||k==="F")go("final",S?S.qi:0);
 else if(k==="b"||k==="B")go("board",S?S.qi:0)});
 document.addEventListener("click",function(e){if(!e.target.closest("[data-q]")&&S&&S.phase!=="qa")hNext()});
 app.insertAdjacentHTML("afterend",'<div class="keys">→ next · Q panel questions · B board · F final · L lobby</div>');
 ensureRoom();setInterval(poll,1200);setInterval(hTick,200);
}else{poll();setInterval(function(){poll()},1800+Math.random()*700);setInterval(tick,200)}
</script>
