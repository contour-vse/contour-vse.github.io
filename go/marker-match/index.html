<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=../../marker-match/">
<title>Marker Match</title>
<link rel="canonical" href="../../marker-match/">
<link rel="stylesheet" href="../../team-challenge/live.css">
<style>
body{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.go{width:100%;max-width:440px;text-align:center;padding:30px 24px}
.go .mark{width:64px;height:64px;border-radius:18px;margin:0 auto 18px}
.go .mark svg{width:32px;height:32px}
.go h1{font-size:30px;font-weight:850;letter-spacing:-.025em;color:var(--navy);margin:4px 0 8px;line-height:1.1}
.go p.sub{color:var(--muted);font-weight:650;margin:0 0 22px}
.go .btn{display:block;text-decoration:none}
.go .dots{display:flex;justify-content:center;gap:6px;margin:0 0 18px}
.go .dots i{width:9px;height:9px;border-radius:50%;background:var(--blue);animation:b 1.2s infinite ease-in-out}
.go .dots i:nth-child(2){animation-delay:.15s}.go .dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
.go .foot{font-size:14px;color:var(--muted);font-weight:650;margin:16px 0 0}
.brandline{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:22px;font-weight:850;color:var(--navy);font-size:15px;letter-spacing:.02em}
.brandline span{width:10px;height:10px;border-radius:3px;background:var(--navy)}
</style>
</head>
<body>
<main class="card go">
  <div class="mark" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18h3M4 13h7M4 8h11"/><path d="M14.5 16.5l2.5 2.5 4.5-5"/></svg></div>
  <p class="eyebrow">Contour</p>
  <h1>Opening Marker Match</h1>
  <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
  <p class="sub">If nothing happens, tap the button</p>
  <a class="btn primary big" id="go" href="../../marker-match/">Open Marker Match</a>
  <p class="foot">Your tutor will show the room code</p>
  <div class="brandline"><span></span>Contour TestPrep</div>
</main>
<script>
(function () {
  var url = "../../marker-match/" + location.search;
  document.getElementById("go").href = url;
  try { location.replace(url); } catch (e) {}
})();
</script>
</body>
</html>
