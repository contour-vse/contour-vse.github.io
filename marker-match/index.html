<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Contour Marker Match: mark a piece like your tutor and see how close you get.">
<meta name="robots" content="noindex">
<title>Marker Match</title>
<link rel="stylesheet" href="../team-challenge/live.css">
<link rel="stylesheet" href="mm.css">
<style>
.wrap{max-width:680px;margin:0 auto;padding:14px 16px 130px;display:flex;flex-direction:column;gap:14px}
#app{display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.me{display:flex;gap:6px;align-items:center}
h2{font-size:28px;font-weight:850;letter-spacing:-.025em;color:var(--navy);margin:2px 0 12px;line-height:1.12}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input{border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:20px;background:#fff;min-width:0;width:100%}
.field input.code{font-family:var(--mono);font-size:32px;font-weight:800;letter-spacing:.25em;text-transform:uppercase;text-align:center;color:var(--navy)}
.field input:focus{border-color:var(--blue);outline:none}
.err{color:var(--orange-ink);font-weight:700;min-height:1.4em;margin:0 0 8px}
.small{font-size:15px}
.strip{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--navy);color:#fff;border-radius:16px;padding:12px 16px}
.strip .lab{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.strip .an{font-weight:850;font-size:22px;letter-spacing:-.01em;line-height:1.1}
.strip .nm{font-size:14px;font-weight:700;opacity:.8}
.strip .tm{text-align:right;line-height:1.05}
.strip .tm b{display:block;font-family:var(--mono);font-size:26px;font-variant-numeric:tabular-nums}
.ptitle{font-size:24px}
.ptext{font-size:17px;max-height:52vh;overflow:auto;padding-right:4px;margin-top:10px}
.ptext.open{max-height:none}
.rowhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.rowhead .eyebrow{margin:0}
.linkbtn{background:none;border:0;color:var(--blue-ink);font-weight:750;text-decoration:underline;padding:6px 0 0}
.bar{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--bg) 70%,rgba(242,246,252,0));padding:18px 16px calc(14px + env(safe-area-inset-bottom));z-index:5}
.bar .in{max-width:680px;margin:0 auto;display:flex;gap:10px;align-items:center}
.bar .btn{flex:1}
.bar .sum{font-family:var(--mono);font-weight:850;color:var(--navy);font-size:20px;white-space:nowrap;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px}
.note{border-radius:14px;padding:12px 14px;font-weight:750;font-size:17px;margin:0}
.note.blue{background:var(--blue-soft);color:var(--blue-ink)}
.note.green{background:var(--green-soft);color:var(--green-ink)}
.wait{text-align:center;padding:28px 16px}
.wait .big{font-size:24px;font-weight:850;color:var(--navy);margin:0 0 6px}
.wait p{margin:0;color:var(--muted)}
.score{display:flex;gap:16px;align-items:center}
.score .n{font-family:var(--mono);font-size:64px;font-weight:850;color:var(--navy);line-height:1;letter-spacing:-.03em}
.score .n small{font-size:24px;color:var(--muted)}
.score .t{font-weight:850;font-size:20px;color:var(--navy);line-height:1.2}
.score .t span{display:block;font-weight:700;font-size:15px;color:var(--muted)}
.cmp{display:grid;gap:6px;margin-top:4px}
.cmp div{display:grid;grid-template-columns:1fr 64px 64px 70px;gap:8px;align-items:center;font-weight:750;border-bottom:1px solid var(--line);padding:6px 0}
.cmp div:last-child{border-bottom:0}
.cmp .h{font-size:12px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cmp b{font-family:var(--mono);text-align:center;font-size:19px;color:var(--navy)}
.cmp b.t{color:var(--orange-ink)}
.cmp .off{font-family:var(--mono);text-align:center;font-weight:850;border-radius:999px;padding:2px 0;font-size:14px}
.cmp .off.z{background:var(--green-soft);color:var(--green-ink)}
.cmp .off.o{background:var(--blue-soft);color:var(--blue-ink)}
.cmp .off.f{background:var(--orange-soft);color:var(--orange-ink)}
.dp{grid-template-columns:86px minmax(0,1fr);gap:8px}
.dpl span{font-size:15px}
.dpl b{font-size:24px}
.stack i{width:10px;height:10px;gap:2px}
.mini{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.mini li{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff;opacity:0;transform:translateY(14px);animation:rise .5s forwards}
.mini li:first-child{border-color:var(--orange);background:var(--orange-soft)}
.mini .pos{font-family:var(--mono);font-weight:850;font-size:20px;color:var(--navy)}
.mini .an{font-weight:850;font-size:19px;color:var(--navy)}
.mini .pp{font-family:var(--mono);font-weight:800;color:var(--navy)}
.mini li.me{box-shadow:0 0 0 3px var(--blue)}
.place{display:flex;gap:14px;align-items:center}
.place b{font-size:52px;font-weight:850;color:var(--navy);letter-spacing:-.03em;line-height:1}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true" id="markIcon"></div>
      <h1>Marker Match</h1>
    </div>
    <div class="me" id="meChip"></div>
  </header>
  <main id="app"></main>
</div>
<div class="bar" id="bar" hidden><div class="in" id="barIn"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="../config.js"></script>
<script src="mm-engine.js"></script>
<script src="mm-api.js"></script>
<script src="mm-ui.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var esc = Net.esc;
  var params = new URLSearchParams(location.search);
  var S = {
    room: (params.get("room") || Net.mine("mm-room") || "").toUpperCase(),
    pid: Net.mine("mm-pid") || Net.uid(),
    name: Net.mine("mm-name") || "",
    joined: false, view: null, lastKey: "", sending: false, open: false, party: ""
  };
  Net.mine("mm-pid", S.pid);
  $("markIcon").innerHTML = UI.ICON;
  if (S.room && S.name && Net.mine("mm-joined") === S.room && (!params.get("room") || params.get("room").toUpperCase() === S.room)) S.joined = true;

  function toast(m) { var t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { t.hidden = true; }, 2600); }
  function bar(html) { $("bar").hidden = !html; $("barIn").innerHTML = html || ""; }
  function dKey(v) { return "mm-draft-" + S.room + "-" + v.round; }
  function draft(v, o) {
    if (o === undefined) { try { return JSON.parse(Net.mine(dKey(v)) || "{}") || {}; } catch (e) { return {}; } }
    Net.mine(dKey(v), JSON.stringify(o));
  }

  function renderJoin(msg) {
    bar(""); $("meChip").innerHTML = Net.demo ? '<span class="chip orange">Demo</span>' : "";
    $("app").innerHTML = '<section class="card"><h2>Join Marker Match</h2>' +
      '<div class="field"><label for="code">Room code</label><input id="code" class="code" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" value="' + esc(S.room) + '"></div>' +
      '<div class="field"><label for="nm">First name</label><input id="nm" maxlength="20" autocomplete="given-name" value="' + esc(S.name) + '"></div>' +
      '<p class="small muted" style="margin:-6px 0 14px;font-weight:650">Your class sees a made up name, never your real one</p>' +
      '<p class="err" id="err">' + esc(msg || "") + '</p><button class="btn primary big block" id="go" type="button">Join</button></section>';
    $("code").addEventListener("input", function (e) { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ""); });
    $("go").onclick = function () {
      var code = $("code").value.trim().toUpperCase(), name = $("nm").value.trim(), btn = this;
      if (code.length !== 6) { $("err").textContent = "The room code has 6 characters"; return; }
      if (!name) { $("err").textContent = "Type your first name"; return; }
      btn.disabled = true;
      Net.call("mm.join", { room: code, pid: S.pid, name: name }).then(function (r) {
        btn.disabled = false;
        if (!r.ok) { $("err").textContent = r.error === "room" ? "No room with that code. Check the board." : (r.message || "Try again"); return; }
        S.room = code; S.name = name; S.joined = true;
        Net.mine("mm-room", code); Net.mine("mm-name", name); Net.mine("mm-joined", code);
        history.replaceState(null, "", "?room=" + code);
        poller.reset(); S.lastKey = ""; poller.now();
      });
    };
  }

  function strip(v) {
    return '<div class="strip"><div><div class="lab">You are</div><div class="an">' + esc(v.me.a) + '</div><div class="nm">' + esc(v.me.n) + ", only you see this</div></div>" +
      '<div class="tm"><b>' + v.me.tot + '</b><span class="lab">Points</span></div></div>';
  }
  function pieceCard(v) {
    var p = v.piece, long = p.text.length > 900;
    return '<section class="card"><div class="rowhead"><p class="eyebrow">Piece ' + v.round + "</p>" + (p.kind ? '<span class="kindchip">' + esc(p.kind) + "</span>" : "") + "</div>" +
      '<h3 class="ptitle">' + esc(p.title) + "</h3>" + (p.prompt ? '<p class="pprompt">' + esc(p.prompt) + "</p>" : "") +
      '<div class="ptext' + (S.open || !long ? " open" : "") + '">' + esc(p.text) + "</div>" +
      (long && !S.open ? '<button class="linkbtn" type="button" id="more">Show the whole piece</button>' : "") + "</section>";
  }

  function renderLobby(v) {
    bar("");
    $("app").innerHTML = strip(v) + '<section class="card wait"><div class="pulse"></div><p class="big">' + (v.rounds ? "Next Piece Soon" : "Get Ready to Mark") + "</p><p>Read the piece, mark it out of 5 on each criterion and lock in</p></section>";
  }
  function renderMarking(v) {
    var mine = v.me.r, d = mine || draft(v), rub = v.piece.rubric || {};
    var rows = MM.CRIT.map(function (c) {
      var b = "";
      for (var i = 1; i <= 5; i++) b += '<button type="button" data-c="' + c + '" data-n="' + i + '" class="' + (d[c] === i ? "on" : "") + '"' + (mine ? " disabled" : "") + ">" + i + "</button>";
      return '<div class="cr' + (d[c] ? " done" : "") + '"><div class="ch"><b>' + c + "</b><small>" + esc(rub[c] || UI.HINT[c]) + '</small></div><div class="nums' + (mine ? " locked" : "") + '">' + b + "</div></div>";
    }).join("");
    $("app").innerHTML = strip(v) + pieceCard(v) +
      (mine ? '<p class="note green">Locked in. Wait for the reveal</p>' : '<p class="note blue">Mark it the way your tutor would, then lock in</p>') +
      '<section class="card"><p class="eyebrow">Your Marks</p><div class="crit" id="crit">' + rows + "</div></section>";
    if ($("more")) $("more").onclick = function () { S.open = true; S.lastKey = ""; render(S.view, false); };
    if (mine) { bar('<span class="sum">' + UI.total(mine) + ' / 20</span><button class="btn green big" type="button" disabled>Locked in</button>'); return; }
    lockBar(v, d);
    $("crit").onclick = function (e) {
      var b = e.target.closest("[data-c]"); if (!b) return;
      var o = draft(v); o[b.dataset.c] = +b.dataset.n; draft(v, o);
      Array.prototype.forEach.call(document.querySelectorAll('[data-c="' + b.dataset.c + '"]'), function (x) { x.classList.toggle("on", x === b); });
      b.closest(".cr").classList.add("done");
      lockBar(v, o);
    };
  }
  function lockBar(v, d) {
    var n = MM.CRIT.filter(function (c) { return d[c]; }).length;
    bar('<span class="sum">' + UI.total(d) + ' / 20</span><button class="btn primary big" id="lock" type="button"' + (n < 4 || S.sending ? " disabled" : "") + ">" + (n < 4 ? "Mark all four" : "Lock in") + "</button>");
    $("lock").onclick = function () {
      if (S.sending) return; S.sending = true; this.disabled = true;
      Net.call("mm.lock", { room: S.room, pid: S.pid, r: draft(v) }).then(function (r) {
        S.sending = false;
        if (!r.ok) { toast(r.message || "Try again"); lockBar(v, draft(v)); return; }
        toast("Locked in"); S.lastKey = ""; poller.now();
      });
    };
  }
  function renderReveal(v) {
    bar("");
    var me = v.me, r = me.r;
    var top = r ? '<section class="card"><div class="score"><div class="n">' + me.pts + '<small>/20</small></div><div class="t">' + (me.d === 0 ? "A Perfect Match" : me.d <= 2 ? "So Close to Your Tutor" : me.d <= 5 ? "Close to Your Tutor" : "Some Way Off This Time") +
      "<span>" + (me.d === 1 ? "1 mark away" : me.d + " marks away") + ", " + UI.pts(me.tot) + " in total, " + UI.ordinal(me.rank) + " of " + me.of + "</span></div></div>" +
      '<div class="cmp" style="margin-top:14px"><div><span class="h">Criterion</span><span class="h" style="text-align:center">You</span><span class="h" style="text-align:center">Tutor</span><span class="h" style="text-align:center">Gap</span></div>' + MM.CRIT.map(function (c) {
        var g = Math.abs(r[c] - v.tm[c]);
        return "<div><span>" + c + "</span><b>" + r[c] + '</b><b class="t">' + v.tm[c] + '</b><span class="off ' + (g === 0 ? "z" : g === 1 ? "o" : "f") + '">' + (g === 0 ? "Match" : g) + "</span></div>";
      }).join("") + "</div></section>" :
      '<section class="card wait"><p class="big">No Marks From You This Time</p><p>Your tutor\'s marks are below</p></section>';
    $("app").innerHTML = strip(v) + top +
      '<section class="card"><div class="rowhead"><p class="eyebrow">The Class</p></div><h3 class="ptitle" style="font-size:21px;margin-bottom:12px">' + esc(v.piece.title) + "</h3>" +
      UI.plots(v.spread, v.tm, { mine: r, avg: v.avg }) +
      '<div class="legend" style="margin-top:16px"><span><i></i>Class</span>' + (r ? '<span><i class="me"></i>You</span>' : "") + '<span><i class="tm"></i>Tutor</span><span><i class="avg"></i>Average</span></div></section>' +
      (v.why ? '<div class="why"><span class="lab">Why</span>' + esc(v.why) + "</div>" : "");
    if (r && me.d <= 2 && S.party !== S.room + v.round) { S.party = S.room + v.round; setTimeout(function () { UI.confetti(2600); }, 1400); }
  }
  function renderLeaderboard(v) {
    bar("");
    var me = v.me;
    var top = (v.top || []).map(function (r, i) {
      return '<li class="' + (r.k === me.k ? "me" : "") + '" style="animation-delay:' + (0.2 + i * 0.2) + 's"><span class="pos">' + UI.ordinal(r.rank) + '</span><span class="an">' + esc(r.a) + '</span><span class="pp">' + r.tot + "</span></li>";
    }).join("");
    $("app").innerHTML = strip(v) + '<section class="card"><h2>Closest Markers</h2>' + (top ? '<ol class="mini">' + top + "</ol>" : '<p class="muted">No marks yet</p>') + "</section>" +
      '<section class="card place"><b>' + UI.ordinal(me.rank) + '</b><div><div style="font-weight:850;font-size:19px;color:var(--navy)">Your place of ' + me.of + '</div><div class="muted" style="font-weight:700">' + UI.pts(me.tot) + " from " + v.rounds + (v.rounds === 1 ? " piece" : " pieces") + "</div></div></section>";
    if (me.rank === 1 && me.tot > 0 && S.party !== S.room + "lb") { S.party = S.room + "lb"; setTimeout(function () { UI.confetti(3200); }, 900); }
  }

  function render(v, same) {
    if (!S.joined || !v) return;
    if (!v.ok) { if (v.error === "room") { S.joined = false; Net.mine("mm-joined", null); renderJoin("That room has closed. Ask for the new code."); } return; }
    if (!v.me) { S.joined = false; Net.mine("mm-joined", null); renderJoin(); return; }
    S.view = v;
    $("meChip").innerHTML = (Net.demo ? '<span class="chip orange">Demo</span>' : "") + '<span class="chip">' + esc(S.room) + "</span>";
    if (same) return;
    /* While marking, only a new piece or my own lock changes this screen. */
    var key = v.phase === "marking" ? ["m", v.round, !!v.me.r, S.open].join("|") : [v.v, v.phase].join("|");
    if (key === S.lastKey) return;
    var first = S.lastPhase !== v.phase || S.lastRound !== v.round;
    if (first) S.open = false;
    S.lastKey = key; S.lastPhase = v.phase; S.lastRound = v.round;
    var sy = window.scrollY;
    if (v.phase === "lobby") renderLobby(v);
    else if (v.phase === "marking") renderMarking(v);
    else if (v.phase === "reveal") renderReveal(v);
    else renderLeaderboard(v);
    window.scrollTo(0, first ? 0 : sy);
  }

  var poller = Net.poll(function () { return S.joined ? { room: S.room, extra: { pid: S.pid } } : null; }, render);
  if (!S.joined) renderJoin();
})();
</script>
</body>
</html>
