<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Step through flowcharts, find far rounds and undo processes.">
<title>Forwards and Backwards</title>
<style>
:root{
  color-scheme:light;
  --bg:#F2F6FC; --panel:#FFFFFF; --ink:#12203D; --muted:#46557A; --line:#D3DDEC; --wash:#F6F9FE;
  --navy:#0B3D91; --navy-soft:#E4ECF8;
  --blue:#007AFF; --blue-ink:#0060C7; --blue-soft:#E5F1FF;
  --green:#2FB76A; --green-ink:#17793F; --green-soft:#E2F5EA;
  --orange:#E88100; --orange-ink:#9A5400; --orange-soft:#FFF0DC;
  --red:#D0342C; --red-ink:#B42318; --red-soft:#FDE8E6;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:18px;line-height:1.4;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
.wrap{max-width:1280px;margin:0 auto;padding:14px 20px 28px;display:flex;flex-direction:column;gap:12px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:40px;height:40px;border-radius:11px;background:var(--navy);display:grid;place-items:center;flex:none}
.brand h1{font-weight:850;font-size:30px;letter-spacing:-.025em;margin:0;color:var(--navy);line-height:1}
.keys{font-size:14px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
kbd{font-family:var(--mono);font-size:13px;border:2px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:0 6px;color:var(--navy);background:#fff}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.tabs button{flex:1 0 auto;min-height:46px;border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 16px;font-size:17px;font-weight:750;color:var(--muted);white-space:nowrap}
.tabs button .n{font-family:var(--mono);margin-right:8px;opacity:.8}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.stage{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:18px 22px;display:flex;flex-direction:column;gap:14px;min-height:540px}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ctl .sp{flex:1}
.btn{min-height:46px;border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:6px 16px;font-weight:750;font-size:17px;line-height:1.15;color:var(--ink)}
.btn:hover{border-color:var(--navy)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-ink);border-color:var(--blue-ink)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.orange{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.ans{border-color:var(--orange);color:var(--orange-ink)}
.btn.ans.on{background:var(--orange);color:#fff}
.btn.sel{background:var(--navy);border-color:var(--navy);color:#fff}
.scene{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:20px;align-items:start}
.scene.wide{grid-template-columns:minmax(0,1fr)}
.vis{min-width:0}
.vis svg{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.prompt{font-weight:850;font-size:clamp(22px,2.4vw,30px);line-height:1.15;color:var(--navy);margin:0;letter-spacing:-.015em}
.stat{border:2px solid var(--line);border-radius:14px;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff}
.stat .l{font-size:16px;font-weight:750;color:var(--muted)}
.stat .v{font-family:var(--mono);font-weight:850;font-size:36px;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.badge{display:inline-block;border-radius:999px;padding:3px 12px;font-size:17px;font-weight:800;vertical-align:middle}
.badge.odd{background:var(--red-soft);color:var(--red-ink);border:2px solid var(--red)}
.badge.even{background:var(--blue-soft);color:var(--blue-ink);border:2px solid var(--blue)}
.badge.good{background:var(--green-soft);color:var(--green-ink);border:2px solid var(--green)}
.badge.warn{background:var(--orange-soft);color:var(--orange-ink);border:2px solid var(--orange)}
.big{font-family:var(--mono);font-weight:850;font-size:40px;color:var(--navy)}
.note{font-size:16px;color:var(--muted);font-weight:650}
.rule{background:var(--blue-soft);border:2px solid var(--blue);border-radius:14px;padding:10px 14px;font-weight:850;font-size:22px;color:var(--navy);text-align:center}
.rule.bad{background:var(--red-soft);border-color:var(--red);color:var(--red-ink)}
.rule.good{background:var(--green-soft);border-color:var(--green);color:var(--green-ink)}
.tbl-wrap{overflow-x:auto;max-width:100%}
table.st{border-collapse:collapse;font-size:20px;min-width:100%}
table.st th,table.st td{border:2px solid var(--line);padding:6px 10px;text-align:center;font-variant-numeric:tabular-nums}
table.st tr>th:first-child{position:sticky;left:0;z-index:1}
table.st th{background:var(--navy-soft);color:var(--navy);font-size:16px;font-weight:800;white-space:nowrap}
table.st td{font-family:var(--mono);font-weight:800;color:var(--navy);min-width:44px}
table.st td.new{background:var(--orange-soft)}
table.st tr.cur td{background:var(--blue-soft)}
.ansv{border-radius:8px}
.stage:not(.ans-on) .ansv{color:transparent!important;background:var(--wash);outline:2px dashed var(--line);position:relative;user-select:none}
.stage:not(.ans-on) .ansv::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-family:var(--sans)}
.stage:not(.ans-on) .ansblock{display:none!important}
.stage.ans-on .ansoff{display:none!important}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;flex-wrap:wrap}
.seg button{min-height:42px;border:0;background:#fff;padding:4px 14px;font-weight:750;font-size:17px;color:var(--muted)}
.seg button+button{border-left:2px solid var(--line)}
.seg button.on{background:var(--navy);color:#fff}
.field{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:750;color:var(--navy)}
.field input[type=number],.field select{width:96px;min-height:44px;border:2px solid var(--line);border-radius:10px;padding:4px 10px;font-size:20px;font-weight:800;background:#fff}
.field input[type=range]{width:220px;accent-color:var(--blue)}
.msg{min-height:30px;font-size:20px;font-weight:800;color:var(--navy)}
.msg.good{color:var(--green-ink)} .msg.bad{color:var(--red-ink)}
.svgtxt{font-family:var(--sans);font-weight:800}
.mono{font-family:var(--mono)}
.tap{cursor:pointer}
@media (max-width:900px){
  .scene{grid-template-columns:minmax(0,1fr)}
  .stage{min-height:0}
}
@media (max-width:640px){
  body{font-size:17px}
  .wrap{padding:10px 12px 24px;gap:10px}
  .brand h1{font-size:24px}.mark{width:34px;height:34px}
  .keys{display:none}
  .tabs button{font-size:15px;padding:6px 12px}
  .stage{padding:12px 12px;border-radius:16px}
  .btn{padding:6px 11px;font-size:16px}
  .ctl{gap:6px}
  .stage>.ctl .sp{display:none}
  .stage>.ctl .btn{padding:6px 10px}
  .stat .v{font-size:30px}
  .rule{font-size:19px}
  table.st{font-size:17px}
  table.st th,table.st td{padding:5px 6px}
  .field input[type=range]{width:160px}
}

.fc .nd rect,.fc .nd path,.fc .nd ellipse{fill:#E4ECF8;stroke:#0B3D91;stroke-width:3;transition:fill .2s,stroke .2s}
.fc .nd.term rect{fill:#EEF1F6;stroke:#46557A}
.fc .nd.on rect,.fc .nd.on path{fill:#FFF0DC;stroke:#E88100;stroke-width:6}
.fc .nd text{font-family:var(--sans);font-weight:750;fill:#12203D}
.fc .ed{fill:none;stroke:#12203D;stroke-width:3}
.fc .ed.on{stroke:#E88100;stroke-width:5}
.fc .lb{font-family:var(--sans);font-weight:850;font-size:24px;fill:#0B3D91}
.chain{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chain .bx{min-width:64px;min-height:56px;border:3px solid var(--navy);border-radius:10px;display:grid;place-items:center;font-family:var(--mono);font-weight:850;font-size:26px;color:var(--navy);background:#fff;padding:0 8px;transition:background .2s,border-color .2s}
.chain .bx.empty{border-style:dashed;border-color:var(--line);color:var(--muted)}
.chain .bx.on{background:var(--orange-soft);border-color:var(--orange)}
.chain .bx.ok{background:var(--green-soft);border-color:var(--green)}
.chain .bx.no{background:var(--red-soft);border-color:var(--red)}
.chain .ar{display:flex;flex-direction:column;align-items:center;font-weight:850;font-size:20px;color:var(--navy);min-width:44px}
.chain .ar i{font-style:normal;font-size:24px;line-height:1}
.chain.back .ar{color:var(--orange-ink)}
.rowlab{font-weight:850;font-size:16px;color:var(--muted);margin:4px 0}
.ways{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.way{border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:20px;font-weight:750}
.way h3{margin:0;font-size:18px;color:var(--muted)}
.way .val{font-family:var(--mono);font-weight:850;font-size:36px;color:var(--navy)}
.way.ok{border-color:var(--green);background:var(--green-soft)}
.way.no{border-color:var(--red);background:var(--red-soft)}
.blocks{display:flex;flex-direction:column;gap:8px}
.blk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff;transition:background .2s,border-color .2s}
.blk.on{background:var(--orange-soft);border-color:var(--orange)}
.blk .tag{font-weight:850;color:var(--navy);min-width:28px}
.blk select,.blk input{min-height:42px;border:2px solid var(--line);border-radius:9px;font-size:19px;font-weight:800;padding:2px 6px;background:#fff}
.blk input{width:72px}
.blk .x{margin-left:auto;border:0;background:transparent;font-size:24px;color:var(--muted);min-width:40px;min-height:40px}
.pal{display:flex;gap:8px;flex-wrap:wrap}
.ringv{transition:opacity .3s}
@media (max-width:640px){.ways{grid-template-columns:1fr}.chain{gap:2px}.chain .bx{min-width:44px;min-height:44px;font-size:18px;padding:0 4px}.chain .ar{min-width:30px;font-size:15px}}
@media (prefers-reduced-motion:reduce){.fc .nd rect,.fc .nd path,.chain .bx,.blk,.ringv{transition:none}}

</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function(){
'use strict';
var RM = false;
try { RM = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){}
var NS = 'http://www.w3.org/2000/svg';
function setAttrs(n, a, isSvg){
  if(!a) return;
  for(var k in a){
    var v = a[k];
    if(v == null || v === false) continue;
    if(k === 'text') n.textContent = v;
    else if(k === 'html') n.innerHTML = v;
    else if(k.slice(0,2) === 'on' && typeof v === 'function') n.addEventListener(k.slice(2), v);
    else if(k === 'class' && !isSvg) n.className = v;
    else n.setAttribute(k, v === true ? '' : v);
  }
}
function add(n, kids){
  kids.forEach(function(c){
    if(c == null || c === false) return;
    if(Array.isArray(c)) add(n, c);
    else n.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)));
  });
}
function h(tag, a){ var n = document.createElement(tag); setAttrs(n, a, false); add(n, [].slice.call(arguments, 2)); return n; }
function s(tag, a){ var n = document.createElementNS(NS, tag); setAttrs(n, a, true); add(n, [].slice.call(arguments, 2)); return n; }
function clear(n){ while(n.firstChild) n.removeChild(n.firstChild); return n; }
function Cancel(){}
function fmt(x){ return String(Math.round(x * 100) / 100); }

function Lab(cfg){
  var app = document.getElementById('app');
  var state = { i: 0, tok: 0, busy: false };
  var tabs = h('nav', { class: 'tabs', role: 'tablist', 'aria-label': 'Steps' });
  var stage = h('main', { class: 'stage', id: 'stage' });
  var playBtn = h('button', { class: 'btn primary', type: 'button', id: 'playBtn' }, 'Play');
  var stepBtn = h('button', { class: 'btn', type: 'button', id: 'stepBtn' }, 'Step');
  var resetBtn = h('button', { class: 'btn', type: 'button', id: 'resetBtn' }, 'Reset');
  var ansBtn = h('button', { class: 'btn ans', type: 'button', id: 'ansBtn', 'aria-pressed': 'false' }, 'Show answer');
  var ctl = h('div', { class: 'ctl' }, playBtn, stepBtn, resetBtn, h('span', { class: 'sp' }), ansBtn);
  var body = h('div', { class: 'body' });
  stage.appendChild(ctl); stage.appendChild(body);
  var head = h('header', { class: 'top' },
    h('div', { class: 'brand' },
      h('div', { class: 'mark', 'aria-hidden': 'true', html: cfg.icon || '' }),
      h('h1', null, cfg.title)),
    h('div', { class: 'keys' }, h('kbd', null, '←'), h('kbd', null, '→'), 'step', h('kbd', null, 'Space'), 'play', h('kbd', null, 'R'), 'reset'));
  app.appendChild(head); app.appendChild(tabs); app.appendChild(stage);

  var cur = null;
  var api = {
    RM: RM,
    wait: function(ms){
      var t = state.tok;
      return new Promise(function(res, rej){
        setTimeout(function(){ if(t !== state.tok) rej(new Cancel()); else res(); }, RM ? Math.min(ms, 60) : ms);
      });
    },
    cancel: function(){ state.tok++; setBusy(false); },
    ans: function(){ return stage.classList.contains('ans-on'); },
    setAns: function(on){ setAns(on); },
    go: function(fn){ return runTask(fn); },
    labels: function(play, step){ playBtn.dataset.lab = play || 'Play'; playBtn.textContent = state.busy ? 'Stop' : playBtn.dataset.lab; stepBtn.textContent = step || 'Step'; },
    refresh: function(){ if(cur && cur.update) cur.update(); }
  };
  function setBusy(b){ state.busy = b; playBtn.textContent = b ? 'Stop' : (playBtn.dataset.lab || 'Play'); }
  function runTask(fn){
    api.cancel();
    var t = state.tok;
    setBusy(true);
    return Promise.resolve().then(fn).catch(function(e){ if(!(e instanceof Cancel)) console.error(e); })
      .then(function(){ if(t === state.tok) setBusy(false); });
  }
  function setAns(on){
    stage.classList.toggle('ans-on', on);
    ansBtn.classList.toggle('on', on);
    ansBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    ansBtn.textContent = on ? 'Hide answer' : 'Show answer';
    if(cur && cur.answer) cur.answer(on);
  }
  cfg.steps.forEach(function(st, i){
    var b = h('button', { type: 'button', role: 'tab', 'aria-selected': 'false', onclick: function(){ go(i); } },
      h('span', { class: 'n' }, String(i + 1)), st.name);
    tabs.appendChild(b);
  });
  function go(i){
    if(i < 0 || i >= cfg.steps.length) return;
    api.cancel();
    state.i = i;
    [].forEach.call(tabs.children, function(b, j){ b.classList.toggle('on', j === i); b.setAttribute('aria-selected', j === i ? 'true' : 'false'); });
    tabs.children[i].scrollIntoView({ block: 'nearest', inline: 'nearest' });
    clear(body);
    stage.classList.remove('ans-on'); ansBtn.classList.remove('on'); ansBtn.textContent = 'Show answer';
    playBtn.dataset.lab = 'Play'; stepBtn.textContent = 'Step';
    cur = cfg.steps[i].make(body, api) || {};
    stepBtn.disabled = !cur.step; playBtn.disabled = !cur.play;
    try { history.replaceState(null, '', '#' + (i + 1)); } catch(e){}
  }
  playBtn.addEventListener('click', function(){
    if(state.busy){ api.cancel(); if(cur.stop) cur.stop(); return; }
    if(cur.play) runTask(function(){ return cur.play(); });
  });
  stepBtn.addEventListener('click', function(){ if(cur.step){ api.cancel(); cur.step(); } });
  resetBtn.addEventListener('click', function(){ api.cancel(); setAns(false); if(cur.reset) cur.reset(); });
  ansBtn.addEventListener('click', function(){ setAns(!stage.classList.contains('ans-on')); });
  document.addEventListener('keydown', function(e){
    var t = e.target, tag = t && t.tagName;
    if(tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || e.metaKey || e.ctrlKey || e.altKey) return;
    if(e.key === 'ArrowRight'){ e.preventDefault(); go(state.i + 1); }
    else if(e.key === 'ArrowLeft'){ e.preventDefault(); go(state.i - 1); }
    else if(e.key === ' ' || e.code === 'Space'){ e.preventDefault(); playBtn.click(); }
    else if(e.key === 'r' || e.key === 'R'){ e.preventDefault(); resetBtn.click(); }
  });
  var start = parseInt((location.hash || '').slice(1), 10);
  go(start >= 1 && start <= cfg.steps.length ? start - 1 : 0);
  window.__lab = { go: go, api: api };
}
window.LabKit = { h: h, s: s, clear: clear, Lab: Lab, fmt: fmt, RM: RM };
})();

</script>
<script id="model">
var Model = (function(){
  /* Step 1: A = 1, B = 1, then A = A + B, B = A + B until B is more than 20, output A */
  function flowEvents(limit){
    limit = limit || 20;
    var A = 1, B = 1, ev = [{ at: 'start', A: null, B: null, round: null }];
    ev.push({ at: 'init', A: A, B: B, round: 0 });
    for(var r = 1; r <= 50; r++){
      A = A + B; ev.push({ at: 'a', A: A, B: B, round: r });
      B = A + B; ev.push({ at: 'b', A: A, B: B, round: r });
      var yes = B > limit; ev.push({ at: 'test', A: A, B: B, round: r, yes: yes });
      if(yes){ ev.push({ at: 'out', A: A, B: B, round: r, out: A }); ev.push({ at: 'stop', A: A, B: B, round: r, out: A }); break; }
    }
    return ev;
  }
  function flowTable(limit){
    var rows = [{ round: 'Start', A: 1, B: 1, test: '' }];
    flowEvents(limit).forEach(function(e){ if(e.at === 'test') rows.push({ round: e.round, A: e.A, B: e.B, test: e.yes ? 'Yes' : 'No' }); });
    return rows;
  }
  function flowOutput(limit){ var ev = flowEvents(limit); return ev[ev.length - 1].out; }

  /* Step 2: halve N if even, add 5 if odd */
  function rule(n){ return n % 2 === 0 ? n / 2 : n + 5; }
  function seq(start, rounds, f){ f = f || rule; var a = [start]; for(var i = 0; i < rounds; i++) a.push(f(a[a.length - 1])); return a; }
  function cycle(start, f){
    f = f || rule; var seen = {}, a = [start];
    seen[start] = 0;
    for(var i = 1; i < 10000; i++){
      var v = f(a[i - 1]);
      if(v in seen) return { start: seen[v], len: i - seen[v], values: a.slice(seen[v]), lead: a.slice(0, seen[v]) };
      seen[v] = i; a.push(v);
    }
    return null;
  }
  function valueAt(start, round, f){
    var c = cycle(start, f);
    if(round < c.start) return c.lead[round];
    return c.values[(round - c.start) % c.len];
  }
  // working for a far round: the last round before it that lands on the cycle's first value
  function jump(start, round, f){
    var c = cycle(start, f);
    if(round < c.start + c.len) return { direct: true, value: valueAt(start, round, f), c: c };
    var q = Math.floor((round - c.start) / c.len), base = c.start + q * c.len;
    return { direct: false, c: c, q: q, base: base, extra: round - base, value: valueAt(start, round, f) };
  }

  /* operations */
  var SYM = { '+': '+', '-': '−', '*': '×', '/': '÷' };
  var INV = { '+': '-', '-': '+', '*': '/', '/': '*' };
  function apply(op, n, x){
    if(op === '+') return x + n;
    if(op === '-') return x - n;
    if(op === '*') return x * n;
    return x / n;
  }
  function runChain(blocks, x){
    var out = [];
    blocks.forEach(function(b){
      if(b.t === 'test'){
        var even = Math.abs(x) % 2 === 0, br = even ? b.yes : b.no;
        x = apply(br.op, br.n, x); out.push({ x: x, branch: even ? 'yes' : 'no' });
      } else { x = apply(b.op, b.n, x); out.push({ x: x }); }
    });
    return out;
  }
  function chainOut(blocks, x){ var r = runChain(blocks, x); return r.length ? r[r.length - 1].x : x; }
  function undo(blocks, y){
    var steps = [];
    for(var i = blocks.length - 1; i >= 0; i--){
      var b = blocks[i], op = INV[b.op], v = apply(op, b.n, y);
      steps.unshift({ from: y, op: op, n: b.n, to: v }); y = v;
    }
    return { start: y, steps: steps };
  }

  /* Step 3: Kofi */
  var kofi = { ops: [{ op: '*', n: 4 }, { op: '-', n: 8 }, { op: '/', n: 2 }], out: 12, wrong: 22 };

  /* Step 4: one round back through the Yes / No box */
  function waysBack(t){

    play: function(){
      lvl = 0; paint();
      return (function next(){ if(lvl >= 4) return; return api.wait(800).then(function(){ lvl++; paint(); return next(); }); })();
    },
    step: function(){ if(lvl < 4){ lvl++; paint(); } },
    reset: function(){ T = 6; inp.value = 6; lvl = 0; paint(); },
    answer: function(on){ if(on){ lvl = 4; paint(); } }
  };
}

/* ---------- Step 5: Build Your Own ---------- */
function stepBuild(root, api){
  var mode = 'build';
  var blocks = [{ t: 'op', op: '*', n: 3 }, { t: 'op', op: '+', n: 1 }, { t: 'test', yes: { op: '/', n: 2 }, no: { op: '+', n: 5 } }];
  var startV = 4, rounds = 3, hi = -1, shownRows = 0;
  var seed = 7, P = M.puzzle(seed);
  var top = h('div', { class: 'seg' });
  var main = h('div', { class: 'side' });
  root.appendChild(h('div', { class: 'scene wide' }, h('div', { class: 'side' }, top, main)));
  [['build', 'Build'], ['find', 'Find the start']].forEach(function(o){
    top.appendChild(h('button', { type: 'button', 'data-k': o[0], onclick: function(){ api.cancel(); mode = o[0]; draw(); } }, o[1]));
  });
  function opSel(o, cb){
    var sel = h('select', { 'aria-label': 'Operation' });
    ['+', '-', '*', '/'].forEach(function(k){ var op = h('option', { value: k }, sym(k)); if(k === o.op) op.selected = true; sel.appendChild(op); });
    var n = h('input', { type: 'number', value: o.n, min: 1, max: 99, 'aria-label': 'Number' });
    sel.addEventListener('change', function(){ o.op = sel.value; cb(); });
    n.addEventListener('change', function(){ o.n = Math.max(1, Math.min(99, parseInt(n.value, 10) || 1)); n.value = o.n; cb(); });
    return [sel, n];
  }
  var tbody, blkEls = [];
  function draw(){
    [].forEach.call(top.children, function(b){ b.classList.toggle('on', b.dataset.k === mode); });
    clear(main); hi = -1; shownRows = 0;
    if(mode === 'build') drawBuild(); else drawFind();
  }
  function drawBuild(){
    var sIn = h('input', { type: 'number', value: startV, 'aria-label': 'Start number' });
    var rIn = h('input', { type: 'number', value: rounds, min: 1, max: 12, 'aria-label': 'Rounds' });
    sIn.addEventListener('change', function(){ startV = parseFloat(sIn.value) || 0; shownRows = 0; table(); });
    rIn.addEventListener('change', function(){ rounds = Math.max(1, Math.min(12, parseInt(rIn.value, 10) || 1)); rIn.value = rounds; shownRows = 0; table(); });
    main.appendChild(h('div', { class: 'ctl' }, h('label', { class: 'field' }, 'Start', sIn), h('label', { class: 'field' }, 'Rounds', rIn)));
    var list = h('div', { class: 'blocks' });
    blkEls = [];
    blocks.forEach(function(b, i){
      var row = h('div', { class: 'blk' }, h('span', { class: 'tag' }, (i + 1) + '.'));
      var ch = function(){ shownRows = 0; table(); };
      if(b.t === 'test'){
        row.appendChild(h('span', { style: 'font-weight:800' }, 'Is N even?'));
        row.appendChild(h('span', { style: 'display:inline-flex;gap:6px;align-items:center' }, h('span', { class: 'badge good' }, 'Yes'), opSel(b.yes, ch)));
        row.appendChild(h('span', { style: 'display:inline-flex;gap:6px;align-items:center' }, h('span', { class: 'badge warn' }, 'No'), opSel(b.no, ch)));
      } else {
        row.appendChild(h('span', { style: 'font-weight:800' }, 'N = N')); opSel(b, ch).forEach(function(e){ row.appendChild(e); });
      }
      row.appendChild(h('button', { class: 'x', type: 'button', 'aria-label': 'Remove', onclick: function(){ blocks.splice(i, 1); draw(); } }, '×'));
      list.appendChild(row); blkEls.push(row);
    });
    main.appendChild(list);
    var pal = h('div', { class: 'pal' });
    ['+', '-', '*', '/'].forEach(function(k){
      pal.appendChild(h('button', { class: 'btn', type: 'button', onclick: function(){ if(blocks.length < 6){ blocks.push({ t: 'op', op: k, n: 2 }); draw(); } } }, sym(k) + ' block'));
    });
    pal.appendChild(h('button', { class: 'btn', type: 'button', onclick: function(){ if(blocks.length < 6){ blocks.push({ t: 'test', yes: { op: '/', n: 2 }, no: { op: '+', n: 5 } }); draw(); } } }, 'Yes / No block'));
    main.appendChild(pal);
    tbody = h('tbody');
    main.appendChild(h('div', { class: 'tbl-wrap' }, h('table', { class: 'st' }, h('thead', null, h('tr', null, h('th', null, 'Round'), h('th', null, 'N'))), tbody)));
    table();
  }
  function history(){
    var x = startV, rows = [{ r: 'Start', x: x }];
    for(var r = 1; r <= rounds; r++){ x = M.chainOut(blocks, x); rows.push({ r: 'Round ' + r, x: x }); if(!isFinite(x) || Math.abs(x) > 1e9) break; }
    return rows;
  }
  function table(){
    if(!tbody) return;
    clear(tbody);
    var rows = history();
    rows.slice(0, shownRows + 1).forEach(function(r, i){
      tbody.appendChild(h('tr', { class: i === shownRows ? 'cur' : '' }, h('th', null, r.r), h('td', null, Math.abs(r.x) > 1e9 ? 'too big' : fmt(r.x))));
    });
    blkEls.forEach(function(e, i){ e.classList.toggle('on', i === hi); });
  }
  function playBuild(){
    shownRows = 0; hi = -1; table();
    var rows = history(), r = 0;
    return (function nextRound(){
      if(r >= rows.length - 1){ hi = -1; table(); return; }
      var b = 0;
      return (function nextBlock(){
        if(b >= blocks.length){ r++; shownRows = r; hi = -1; table(); return api.wait(250).then(nextRound); }
        hi = b; table(); b++;
        return api.wait(420).then(nextBlock);
      })();
    })();
  }
  /* find the start */
  function drawFind(){
    var vals = ['?'], ops = [];
    P.blocks.forEach(function(b, i){ ops.push(sym(b.op) + ' ' + b.n); vals.push(i === P.blocks.length - 1 ? P.out : ''); });
    main.appendChild(h('p', { class: 'prompt' }, 'Find the start number'));
    main.appendChild(chainRow(vals, ops, false));
    var inp = h('input', { type: 'number', 'aria-label': 'Start number' });
    var msg = h('div', { class: 'msg' }), chk = h('button', { class: 'btn navy', type: 'button' }, 'Check');
    var res = h('div');
    chk.addEventListener('click', function(){
      var v = parseFloat(inp.value); if(isNaN(v)) return;
      var r = M.runChain(P.blocks, v), got = r[r.length - 1].x, ok = Math.abs(got - P.out) < 1e-9;
      clear(res).appendChild(chainRow([v].concat(r.map(function(x){ return fmt(x.x); })), ops, false, r.map(function(){ return null; }).concat([ok ? 'ok' : 'no']).slice(-1 - r.length)));
      msg.textContent = ok ? 'Yes! ' + v + ' gives ' + P.out : v + ' gives ' + fmt(got) + ', not ' + P.out;
      msg.className = 'msg ' + (ok ? 'good' : 'bad');
    });
    inp.addEventListener('keydown', function(e){ if(e.key === 'Enter') chk.click(); });
    main.appendChild(h('div', { class: 'ctl' }, h('label', { class: 'field' }, 'Start', inp), chk,
      h('button', { class: 'btn', type: 'button', onclick: function(){ seed = (seed * 48271 + 11) % 2147483647; P = M.puzzle(seed); draw(); } }, 'New puzzle'), msg));
    main.appendChild(res);
    var U = M.undo(P.blocks, P.out);
    var bvals = [U.start].concat(U.steps.map(function(s2){ return s2.from; }));
    var bops = U.steps.map(function(s2){ return sym(s2.op) + ' ' + s2.n; });
    main.appendChild(h('div', { class: 'ansblock side' }, h('div', { class: 'rowlab' }, 'Backwards'), chainRow(bvals, bops, true), h('div', { class: 'rule good' }, 'Start = ' + U.start)));
  }
  draw();
  return {
    play: function(){ if(mode === 'build') return playBuild(); },
    step: function(){ if(mode === 'build'){ var n = history().length - 1; if(shownRows < n){ shownRows++; table(); } } },
    reset: function(){
      blocks = [{ t: 'op', op: '*', n: 3 }, { t: 'op', op: '+', n: 1 }, { t: 'test', yes: { op: '/', n: 2 }, no: { op: '+', n: 5 } }];
      startV = 4; rounds = 3; draw();
    }
  };
}

K.Lab({ title: 'Forwards and Backwards', icon: ICON, steps: [
  { name: 'Run the Loop', make: stepRun },
  { name: 'Far Rounds', make: stepFar },
  { name: 'Undo It', make: stepUndo },
  { name: 'Two Ways Back', make: stepTwo },
  { name: 'Build Your Own', make: stepBuild }
]});
})();
