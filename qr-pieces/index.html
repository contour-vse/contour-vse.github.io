<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Fit pieces into a shape by counting squares, filling the awkward square first and spotting flipped pieces.">
<title>Which Pieces · Contour</title>
<style>
:root{
  color-scheme:light;
  --bg:#F2F6FC; --panel:#FFFFFF; --ink:#12203D; --muted:#46557A; --line:#D3DDEC; --wash:#F6F9FE;
  --navy:#0B3D91; --navy-soft:#E4ECF8;
  --blue:#007AFF; --blue-ink:#0060C7; --blue-soft:#E5F1FF;
  --green:#2FB76A; --green-ink:#17793F; --green-soft:#E2F5EA;
  --orange:#E88100; --orange-ink:#9A5400; --orange-soft:#FFF0DC;
  --red:#D62C2C; --red-soft:#FDE7E7;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:18px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:12px 18px 24px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:40px;height:40px;border-radius:11px;background:var(--navy);display:grid;place-items:center;flex:none}
.brand h1{font-weight:850;font-size:28px;letter-spacing:-.02em;margin:0;color:var(--navy);line-height:1}
.keys{font-family:var(--mono);font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.keys b{background:var(--panel);border:1.5px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--navy)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.tabs button{flex:1 0 auto;min-height:44px;border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 16px;font-size:17px;font-weight:750;color:var(--muted);white-space:nowrap}
.tabs button .n{font-family:var(--mono);margin-right:7px;color:var(--blue-ink)}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tabs button.on .n{color:#AFC8F0}
.stage{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;min-height:560px}
.vis{position:relative;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.side{display:flex;flex-direction:column;gap:9px;min-width:0}
.q{font-weight:850;font-size:24px;line-height:1.15;color:var(--navy);letter-spacing:-.01em;margin:0}
.ctrls{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:44px;border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 14px;font-weight:750;font-size:17px;line-height:1.1;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--navy)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-ink);border-color:var(--blue-ink)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.on{background:var(--navy-soft);border-color:var(--navy);color:var(--navy)}
.btn:disabled{opacity:.4;cursor:default}
.btn .k{font-family:var(--mono);font-size:12px;opacity:.75}
.ans-t{width:100%;border:2px dashed var(--orange);background:var(--orange-soft);color:var(--orange-ink)}
.ans-t[aria-pressed="true"]{border-style:solid;background:var(--orange);color:#fff}
.ans{border:2px solid var(--orange);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:#fff}
.big{font-size:44px;font-weight:900;color:var(--blue-ink);line-height:1;letter-spacing:-.02em}
.mid{font-size:26px;font-weight:850;color:var(--navy);line-height:1.15}
.rule{font-size:19px;font-weight:750;color:var(--navy)}
.rule em{font-style:normal;color:var(--blue-ink)}
.lbl{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);border-radius:12px;padding:4px 10px;font-weight:800;font-size:18px;background:#fff;color:var(--navy);min-width:44px;text-align:center}
.chip small{display:block;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.chip.hot{border-color:var(--blue);background:var(--blue-soft);color:var(--blue-ink)}
.chip.good{border-color:var(--green);background:var(--green-soft);color:var(--green-ink)}
.chip.bad{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:16px;font-weight:700}
.ok{color:var(--green-ink)} .no{color:var(--red)}
@media (max-width:860px){
  .stage{display:flex;flex-direction:column;padding:12px;min-height:0;gap:12px}
  .side{display:contents}
  .q{order:-1}
  .brand h1{font-size:23px}
  .keys{display:none}
  .q{font-size:21px}
  .tabs button{font-size:15px;padding:6px 12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.pb{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.board{display:block;touch-action:none;max-width:100%;height:auto}
.tray{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tp{border:2px solid var(--line);background:#fff;border-radius:14px;padding:6px 8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:72px;min-height:44px;touch-action:none;user-select:none;-webkit-user-select:none}
.tp svg{display:block;pointer-events:none}
.tp b{font-size:20px;color:var(--navy);line-height:1.1}
.tp small{font-size:13px;font-weight:800;color:var(--muted)}
.tp.sel{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 0 0 3px rgba(0,122,255,.18)}
.tp.used{opacity:.35}
.tp.flipped b::after{content:" flipped";font-size:12px;color:var(--red);font-weight:800}
.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:50;opacity:.85}
.optlist{display:flex;flex-direction:column;gap:6px}
.ob{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:12px;background:#fff;min-height:44px;padding:6px 12px;font-weight:800;font-size:18px;color:var(--navy);text-align:left}
.ob .L{font-family:var(--mono);color:var(--blue-ink);width:22px}
.ob .sum{margin-left:auto;font-size:15px;color:var(--muted)}
.ob.pick{border-color:var(--blue);background:var(--blue-soft)}
.ob.out{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted);border-color:var(--red);background:var(--red-soft)}
.ob.right{border-color:var(--green);background:var(--green-soft);color:var(--green-ink)}
.ob.flip{border-color:var(--orange);background:var(--orange-soft)}
.rowb{display:flex;gap:8px;flex-wrap:wrap}
.status{font-weight:850;font-size:20px;color:var(--navy);min-height:28px;text-align:center}
.turnrow{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}
.cand{border:3px solid transparent;border-radius:16px;padding:6px 8px;background:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:44px}
.cand b{font-size:24px;color:var(--navy)}
.cand small{font-size:14px;font-weight:850;min-height:18px}
.cand.circ{border-color:var(--blue)}
.cand.turned{border-color:var(--green);background:var(--green-soft)} .cand.turned small{color:var(--green-ink)}
.cand.flipped{border-color:var(--orange);background:var(--orange-soft)} .cand.flipped small{color:var(--orange-ink)}
.cand.match{animation:pop .5s}
@keyframes pop{50%{transform:scale(1.12)}}
.qbox{display:flex;flex-direction:column;align-items:center;gap:4px;padding-right:18px;border-right:3px solid var(--line)}
.qbox svg g{transition:transform .6s ease}
.shake{animation:sh .35s}
@keyframes sh{30%{transform:translateX(-6px)}60%{transform:translateX(6px)}}
.seg{display:flex;border:2px solid var(--navy);border-radius:12px;overflow:hidden;width:max-content;max-width:100%}
.seg button{border:0;background:#fff;min-height:42px;padding:6px 14px;font-weight:800;color:var(--navy)}
.seg button.on{background:var(--navy);color:#fff}

<script id="model">
/* which pieces model: cells are [row, col] */
(function(root){
  function norm(s){ var mr = Math.min.apply(0, s.map(function(p){ return p[0]; })), mc = Math.min.apply(0, s.map(function(p){ return p[1]; }));
    return s.map(function(p){ return [p[0] - mr, p[1] - mc]; }).sort(function(a, b){ return a[0] - b[0] || a[1] - b[1]; }); }
  function rot(s){ return norm(s.map(function(p){ return [p[1], -p[0]]; })); }      // quarter turn
  function flip(s){ return norm(s.map(function(p){ return [p[0], -p[1]]; })); }     // face down (mirror left to right)
  function key(s){ return norm(s).map(function(p){ return p.join(','); }).join(';'); }
  function same(a, b){ return key(a) === key(b); }
  function turns(s){ var out = [], cur = norm(s), seen = {}; for(var i = 0; i < 4; i++){ var k = key(cur); if(!seen[k]){ seen[k] = 1; out.push(cur); } cur = rot(cur); } return out; }
  function orientations(s, allowFlip){ var out = turns(s); if(allowFlip){ var seen = {}; out.forEach(function(o){ seen[key(o)] = 1; });
    turns(flip(s)).forEach(function(o){ if(!seen[key(o)]){ seen[key(o)] = 1; out.push(o); } }); } return out; }
  function isTurnOf(a, b){ return turns(b).some(function(o){ return same(o, a); }); }
  function cellSet(s){ var o = {}; s.forEach(function(p){ o[p.join(',')] = 1; }); return o; }
  function placements(shape, piece, allowFlip){
    var S = cellSet(shape), out = [];
    orientations(piece, allowFlip).forEach(function(o, oi){
      shape.forEach(function(anchor){ var dr = anchor[0] - o[0][0], dc = anchor[1] - o[0][1];
        var cells = o.map(function(p){ return [p[0] + dr, p[1] + dc]; });
        if(cells.every(function(p){ return S[p.join(',')]; })) out.push({ cells:cells, flipped: !turns(piece).some(function(t){ return same(t, o); }) }); });
    });
    return out;
  }
  // all exact covers of the shape using each listed piece once
  function tilings(shape, pieces, allowFlip){
    var total = pieces.reduce(function(a, p){ return a + p.length; }, 0); if(total !== shape.length) return [];
    var pl = pieces.map(function(p){ return placements(shape, p, allowFlip); }), res = [];
    var order = shape.slice().sort(function(a, b){ return a[0] - b[0] || a[1] - b[1]; });
    function go(used, covered, chosen){
      var first = null; for(var i = 0; i < order.length; i++){ if(!covered[order[i].join(',')]){ first = order[i].join(','); break; } }
      if(!first){ res.push(chosen.slice()); return; }
      pieces.forEach(function(p, pi){ if(used[pi]) return;
        pl[pi].forEach(function(q){ var ks = q.cells.map(function(c){ return c.join(','); });
          if(ks.indexOf(first) < 0 || ks.some(function(k){ return covered[k]; })) return;
          used[pi] = 1; ks.forEach(function(k){ covered[k] = 1; }); chosen.push({ piece:pi, cells:q.cells, flipped:q.flipped });
          go(used, covered, chosen);
          chosen.pop(); ks.forEach(function(k){ delete covered[k]; }); used[pi] = 0; }); });
    }
    go({}, {}, []);
    return res;
  }
  function neighbours(shape){ var S = cellSet(shape);
    return shape.map(function(p){ return [[1,0],[-1,0],[0,1],[0,-1]].filter(function(d){ return S[(p[0] + d[0]) + ',' + (p[1] + d[1])]; }).length; }); }
  function awkward(shape){ var n = neighbours(shape), m = Math.min.apply(0, n); return shape.filter(function(p, i){ return n[i] === m; }); }
  function reaches(shape, piece, cell, allowFlip){ return placements(shape, piece, allowFlip).some(function(q){ return q.cells.some(function(c){ return c[0] === cell[0] && c[1] === cell[1]; }); }); }
  function minus(shape, cells){ var C = cellSet(cells); return shape.filter(function(p){ return !C[p.join(',')]; }); }
  function solve(pz){   // which option pairs make the shape (turns only), and which only work flipped
    return pz.options.map(function(o){
      var ps = o.map(function(n){ return pz.pieces[n]; });
      var squares = ps.reduce(function(a, p){ return a + p.length; }, 0);
      var t = tilings(pz.shape, ps, false), tf = tilings(pz.shape, ps, true);
      return { names:o, squares:squares, countOk: squares === pz.shape.length, fits: t.length > 0, fitsFlipped: t.length === 0 && tf.length > 0, tiling: t[0] || null, flippedTiling: tf[0] || null };
    });
  }
  var BOOK = {
    shape: [[0,0],[1,0],[1,1],[1,2],[1,3],[2,1],[2,2],[2,3]],
    pieces: { P:[[0,1],[1,0],[1,1]], Q:[[0,0],[1,0],[1,1],[1,2],[2,1]], R:[[0,1],[1,0],[1,1],[2,1],[2,2]], S:[[0,0],[0,1],[0,2]] },
    options: [['P','R'],['P','Q'],['Q','S'],['P','S']] };
  var Q = BOOK.pieces.Q;
  var api = { norm:norm, rot:rot, flip:flip, key:key, same:same, turns:turns, orientations:orientations, isTurnOf:isTurnOf, placements:placements,
    tilings:tilings, neighbours:neighbours, awkward:awkward, reaches:reaches, minus:minus, solve:solve, BOOK:BOOK,
    // Turned or Flipped: the four pieces from the booklet figure
    TURN: [rot(Q), flip(Q), rot(rot(Q)), rot(flip(Q))],
    // two extra puzzles, made by gen_pieces.js and checked by brute force
    EXTRA: /*EXTRA*/[{"shape":[[0,1],[1,1],[1,2],[2,0],[2,1],[2,2],[3,0],[3,1],[3,2]],"pieces":{"P":[[0,1],[1,1],[1,2],[2,0],[2,1]],"Q":[[0,1],[1,0],[1,1],[2,1],[2,2]],"R":[[0,0],[0,1],[1,1],[2,1]],"S":[[0,0],[0,1],[1,1]]},"options":[["Q","R"],["Q","S"],["P","S"],["P","R"]],"answer":["P","R"]},{"shape":[[0,0],[0,1],[0,2],[0,3],[1,0],[1,1],[1,3],[1,4]],"pieces":{"P":[[0,0],[0,1],[1,1]],"Q":[[0,0],[0,1],[0,2],[0,3]],"R":[[0,0],[1,0],[1,1],[2,1],[3,1]],"S":[[0,1],[1,0],[1,1],[2,0],[3,0]]},"options":[["P","S"],["P","R"],["Q","R"],["Q","S"]],"answer":["P","S"]}] };

})(this);

</script>
<script>
/* shared lab shell: tabs, controls, keyboard, answer toggle, tweening */
var Lab = (function(){
  var RM = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cfg, cur = -1, inst = null, gen = 0, showAns = false;
  var $ = function(id){ return document.getElementById(id); };
  function el(tag, cls, html){ var e = document.createElement(tag); if(cls) e.className = cls; if(html != null) e.innerHTML = html; return e; }
  function sleep(ms, g){ return new Promise(function(res, rej){ setTimeout(function(){ g === gen ? res() : rej('x'); }, RM ? 0 : ms); }); }
  function tween(ms, fn, g){
    return new Promise(function(res, rej){
      if(RM || ms <= 0){ fn(1); res(); return; }
      var t0 = performance.now();
      function f(now){
        if(g !== gen){ rej('x'); return; }
        var t = Math.min(1, (now - t0) / ms);
        fn(t);
        if(t < 1) requestAnimationFrame(f); else res();
      }
      requestAnimationFrame(f);
    });
  }
  function ease(t){ return t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2; }
  function setAns(v){
    showAns = v;
    var b = $('ansBtn'); b.setAttribute('aria-pressed', v ? 'true' : 'false');
    b.textContent = v ? 'Hide answer' : 'Show answer';
    $('ans').hidden = !v || !$('ans').innerHTML;
    if(inst && inst.answer) inst.answer(v);
  }
  function go(i){
    if(i < 0 || i >= cfg.steps.length) return;
    gen++; cur = i;
    if(inst && inst.destroy) inst.destroy();
    var s = cfg.steps[i];
    [].forEach.call($('tabs').children, function(b, j){ b.classList.toggle('on', j === i); b.setAttribute('aria-selected', j === i ? 'true' : 'false'); });
    $('q').textContent = s.q || '';
    $('q').hidden = !s.q;
    $('vis').innerHTML = ''; $('extra').innerHTML = ''; $('ans').innerHTML = '';
    $('playBtn').hidden = s.play === false; $('stepBtn').hidden = s.step === false;
    $('ansBtn').hidden = s.answer === false;
    $('stepBtn').textContent = s.stepLabel || 'Step';
    if(s.playLabel) $('playBtn').firstChild.nodeValue = s.playLabel + ' '; else $('playBtn').firstChild.nodeValue = 'Play ';
    showAns = false;
    inst = s.mount({ vis: $('vis'), extra: $('extra'), ans: $('ans'), gen: gen, el: el,
      alive: function(g){ return g === gen; } }) || {};
    setAns(false);
    try { history.replaceState(null, '', '#' + (i + 1)); } catch(e) {}
  }
  function guard(p){ if(p && p.catch) p.catch(function(){}); }
  function init(c){
    cfg = c;
    document.title = c.title + ' · Contour';
    $('title').textContent = c.title;
    c.steps.forEach(function(s, i){
      var b = el('button', '', '<span class="n">' + (i + 1) + '</span>' + s.name);
      b.type = 'button'; b.setAttribute('role', 'tab');
      b.onclick = function(){ go(i); };
      $('tabs').appendChild(b);
    });
    $('playBtn').onclick = function(){ if(inst.play) guard(inst.play()); };
    $('stepBtn').onclick = function(){ if(inst.step) guard(inst.step()); };
    $('resetBtn').onclick = function(){ reset(); };
    $('ansBtn').onclick = function(){ setAns(!showAns); };
    document.addEventListener('keydown', function(e){
      if(e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
      if(e.altKey || e.ctrlKey || e.metaKey) return;
      if(inst && inst.key && inst.key(e)) { e.preventDefault(); return; }
      if(e.key === 'ArrowRight'){ go(cur + 1); e.preventDefault(); }
      else if(e.key === 'ArrowLeft'){ go(cur - 1); e.preventDefault(); }
      else if(e.key === ' '){ if(!$('playBtn').hidden && inst.play) guard(inst.play()); e.preventDefault(); }
      else if(e.key === 'r' || e.key === 'R'){ reset(); }
      else if(e.key === 'a' || e.key === 'A'){ if(!$('ansBtn').hidden) setAns(!showAns); }
    });
    var h = parseInt((location.hash || '').slice(1), 10);
    go(h >= 1 && h <= c.steps.length ? h - 1 : 0);
  }
  function reset(){ gen++; var keep = showAns; if(inst && inst.reset) inst.reset(); else go(cur); if(keep) setAns(true); }
  function refreshAns(){ $('ans').hidden = !showAns || !$('ans').innerHTML; }
  return { init: init, tween: tween, sleep: sleep, ease: ease, el: el, RM: RM,
    gen: function(){ return gen; }, bump: function(){ return ++gen; }, showing: function(){ return showAns; },
    refreshAns: refreshAns, go: go, guard: guard };
})();

</script>

    if(a.t === 'turn'){ ang += 90; cur = M.rot(cur); }
    else { fl = -fl; cur = M.flip(cur); }
    setT(); status.innerHTML = a.t === 'flip' ? '<span style="color:var(--orange-ink)">Flip Q over</span>' : (fl < 0 ? 'Flipped Q, turned' : 'Q turned') + ' ' + (((ang % 360) + 360) % 360) + '&deg;';
    return Lab.sleep(Lab.RM ? 0 : 650, g).then(function(){ check(cur); });
  }
  function rst(){ Lab.bump(); ang = 0; fl = 1; k = 0; cur = Q; seen = {}; if(qg) setT(); status.innerHTML = '&nbsp;'; marks(); }
  return {
    play: function(){ rst(); var g = Lab.gen(); var p = Lab.sleep(200, g); stepsList.forEach(function(){ p = p.then(function(){ return doStep(g); }).then(function(){ return Lab.sleep(350, g); }); }); return p; },
    step: function(){ var g = Lab.bump(); if(k >= stepsList.length){ rst(); return; } return doStep(g); },
    reset: rst, answer: marks, destroy: off };
}

function stepFree(ctx){
  var vis = ctx.vis, puzzles = [M.BOOK].concat(M.EXTRA || []), cur = 0, pb = null, picks = {};
  var pick = el('div', 'seg'); vis.appendChild(pick);
  var holder = el('div'); holder.style.width = '100%'; vis.appendChild(holder);
  function mount(i){
    cur = i; holder.innerHTML = ''; picks = {};
    pb = new PieceBoard(holder, puzzles[i], { showCount:true, hf:0.36, maxU:70 });
    pb.onChange = side;
    pick.innerHTML = puzzles.map(function(p, j){ return '<button type="button" class="' + (j === i ? 'on' : '') + '" data-j="' + j + '">' + (j === 0 ? 'Booklet' : 'Puzzle ' + (j + 1)) + '</button>'; }).join('');
    pick.querySelectorAll('button').forEach(function(b){ b.onclick = function(){ mount(+b.dataset.j); }; });
    side(); ans();
  }
  function side(){
    if(!pb) return;
    var occ = Object.keys(pb.occupied()).length;
    ctx.extra.innerHTML = toolsHTML() +
      '<div class="stats" style="display:flex;gap:8px;margin-top:8px"><div class="chip"><small>Shape</small>' + pb.pz.shape.length + '</div><div class="chip"><small>Placed</small>' + occ + '</div></div>' +
      '<div class="lbl" style="margin-top:8px">Options</div>' + optionList(pb.pz, picks, Lab.showing());
    wireTools(ctx.extra, pb);
    ctx.extra.querySelectorAll('.ob').forEach(function(b){ b.onclick = function(){ picks[b.dataset.i] = !picks[b.dataset.i]; side(); }; });
  }
  function ans(){
    var sol = M.solve(pb.pz), right = sol.filter(function(s){ return s.fits; })[0];
    ctx.ans.innerHTML = '<div class="rule">Answer: <em>' + right.names.join(' and ') + '</em></div>' +
      sol.filter(function(s){ return s.fitsFlipped; }).map(function(s){ return '<div class="rule">' + s.names.join(' and ') + ': only flipped</div>'; }).join('');
    Lab.refreshAns();
    if(Lab.showing()){ // place the solution
      pb.reset(); right.tiling.forEach(function(t){ var n = right.names[t.piece]; pb.orient[n] = M.norm(t.cells); pb.placed[n] = t.cells; });
      pb.draw(); pb.drawTray(); pb.changed();
    }
    side();
  }
  mount(0);
  ctx.extra.style.minWidth = '0';
  var off = onResize(function(){ pb.size(); pb.draw(); pb.drawTray(); });
  return { reset: function(){ pb.reset(); picks = {}; side(); }, answer: ans, destroy: off };
}

Lab.init({ title: 'Which Pieces', steps: [
  { name:'Count Squares', q:'Which two pieces make the shape?', mount: stepCount },
  { name:'Awkward Square', q:'Which square is the hardest to fill?', mount: stepAwkward },
  { name:'Turn or Flip', q:'Which pieces are Q turned?', mount: stepTurn },
  { name:'Free Play', q:'', play:false, step:false, mount: stepFree }
]});
})();

</script>
